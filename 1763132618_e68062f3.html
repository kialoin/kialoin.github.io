<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮箱验证 - 智能学生碎片知识整理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-blue: #4f46e5;
            --light-blue: #6366f1;
            --purple: #8b5cf6;
            --success-green: #10b981;
            --warning-orange: #f59e0b;
            --error-red: #ef4444;
            --bg-light: #f8fafc;
            --bg-gray: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --border-gray: #cbd5e1;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23ffffff" fill-opacity="0.1" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,122.7C672,117,768,139,864,138.7C960,139,1056,117,1152,112C1248,107,1344,117,1392,122.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') no-repeat bottom;
            background-size: cover;
            z-index: -1;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.18);
            padding: 1rem 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-link {
            color: var(--text-secondary);
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            margin: 0 0.25rem;
        }
        .nav-link:hover {
            color: var(--secondary-blue);
            background: rgba(79, 70, 229, 0.1);
        }
        .nav-link.active {
            color: var(--secondary-blue);
            background: rgba(79, 70, 229, 0.15);
        }
        .main-container {
            padding: 2rem 0;
            min-height: calc(100vh - 76px);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }
        .form-control:focus {
            border-color: var(--light-blue);
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
        }
        .btn-primary {
            background: var(--primary-gradient);
            border: none;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .code-input {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
        }
        .code-digit {
            width: 45px;
            height: 45px;
            text-align: center;
            font-size: 1.25rem;
            font-weight: bold;
            border: 2px solid var(--border-light);
            border-radius: 8px;
            background: white;
            transition: all 0.2s ease;
        }
        .code-digit:focus {
            border-color: var(--light-blue);
            outline: none;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
        }
        .countdown {
            color: var(--warning-orange);
            font-weight: 600;
        }
        @media (max-width: 768px) {
            .code-digit {
                width: 40px;
                height: 40px;
                font-size: 1.1rem;
            }
            .navbar-nav {
                text-align: center;
            }
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in {
            animation: fadeInUp 0.6s ease forwards;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-gray);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--light-blue);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-blue);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-brain me-2"></i>知识整理系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fas fa-home me-1"></i>首页</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-book me-1"></i>知识管理
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#"><i class="fas fa-list me-2"></i>知识列表</a></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-folder me-2"></i>分类管理</a></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-tags me-2"></i>标签管理</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fas fa-cloud-upload-alt me-1"></i>采集中心</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fas fa-calendar-check me-1"></i>复习计划</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fas fa-search me-1"></i>搜索</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle me-1"></i>个人中心
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#"><i class="fas fa-user me-2"></i>个人资料</a></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-cog me-2"></i>设置</a></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-question-circle me-2"></i>帮助</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-sign-out-alt me-2"></i>退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container main-container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="glass-card animate-fade-in">
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <i class="fas fa-envelope-open-text fa-3x text-primary"></i>
                        </div>
                        <h2 class="mb-2">邮箱验证</h2>
                        <p class="text-muted">我们已向您的邮箱发送了一封验证邮件，请查收并输入验证码</p>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">验证邮箱地址</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" class="form-control" value="user@example.com" readonly>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">请输入验证码</label>
                        <div class="code-input">
                            <input type="text" class="code-digit" maxlength="1" data-index="0">
                            <input type="text" class="code-digit" maxlength="1" data-index="1">
                            <input type="text" class="code-digit" maxlength="1" data-index="2">
                            <input type="text" class="code-digit" maxlength="1" data-index="3">
                            <input type="text" class="code-digit" maxlength="1" data-index="4">
                            <input type="text" class="code-digit" maxlength="1" data-index="5">
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <span class="text-muted">验证码已发送至邮箱</span>
                        </div>
                        <div>
                            <span class="countdown" id="countdown">60秒后可重发</span>
                        </div>
                    </div>
                    <button class="btn btn-primary w-100 mb-3" id="verifyBtn">
                        <i class="fas fa-check-circle me-2"></i>验证邮箱
                    </button>
                    <div class="text-center">
                        <button class="btn btn-outline-secondary" id="resendBtn">
                            <i class="fas fa-redo me-2"></i>重新发送验证码
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const codeInputs = document.querySelectorAll('.code-digit');
            codeInputs.forEach((input, index) => {
                input.addEventListener('input', function() {
                    if (this.value.length === 1 && index < codeInputs.length - 1) {
                        codeInputs[index + 1].focus();
                    }
                });
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && this.value === '' && index > 0) {
                        codeInputs[index - 1].focus();
                    }
                });
            });
            let countdown = 60;
            const countdownElement = document.getElementById('countdown');
            const resendBtn = document.getElementById('resendBtn');
            function startCountdown() {
                countdown = 60;
                resendBtn.disabled = true;
                resendBtn.innerHTML = '<i class="fas fa-redo me-2"></i>重新发送验证码';
                const timer = setInterval(() => {
                    countdown--;
                    countdownElement.textContent = `${countdown}秒后可重发`;
                    if (countdown <= 0) {
                        clearInterval(timer);
                        resendBtn.disabled = false;
                        countdownElement.textContent = '';
                    }
                }, 1000);
            }
            resendBtn.addEventListener('click', function() {
                this.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>发送中...';
                setTimeout(() => {
                    this.innerHTML = '<i class="fas fa-redo me-2"></i>重新发送验证码';
                    startCountdown();
                    alert('验证码已重新发送至您的邮箱！');
                }, 1000);
            });
            const verifyBtn = document.getElementById('verifyBtn');
            verifyBtn.addEventListener('click', function() {
                const code = Array.from(codeInputs).map(input => input.value).join('');
                if (code.length !== 6) {
                    alert('请输入完整的6位验证码');
                    return;
                }
                this.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>验证中...';
                setTimeout(() => {
                    this.innerHTML = '<i class="fas fa-check-circle me-2"></i>验证邮箱';
                    alert('邮箱验证成功！');
                }, 1500);
            });
            startCountdown();
        });
    </script>
</body>
</html>
