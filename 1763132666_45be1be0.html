<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能学生碎片知识整理系统 - 个人资料</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-blue: #4f46e5;
            --light-blue: #6366f1;
            --purple: #8b5cf6;
            --success-green: #10b981;
            --warning-orange: #f59e0b;
            --error-red: #ef4444;
            --bg-light: #f8fafc;
            --bg-gray: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --border-gray: #cbd5e1;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23ffffff" fill-opacity="0.1" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,122.7C672,117,768,139,864,138.7C960,139,1056,117,1152,112C1248,107,1344,117,1392,122.7L1440,128L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') no-repeat bottom;
            background-size: cover;
            z-index: -1;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.18);
            padding: 1rem 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-link {
            color: var(--text-secondary);
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            margin: 0 0.25rem;
        }
        .nav-link:hover {
            color: var(--secondary-blue);
            background: rgba(79, 70, 229, 0.1);
        }
        .nav-link.active {
            color: var(--secondary-blue);
            background: rgba(79, 70, 229, 0.15);
        }
        .main-container {
            padding: 2rem 0;
            min-height: calc(100vh - 76px);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }
        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }
        .form-control:focus, .form-select:focus {
            background: white;
            border-color: var(--light-blue);
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
        }
        .form-label {
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        .btn-primary {
            background: var(--primary-gradient);
            border: none;
            border-radius: 12px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .avatar-upload {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 1.5rem;
        }
        .avatar-preview {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--border-light);
            background: var(--bg-gray);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }
        .avatar-upload input {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .avatar-upload label {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--primary-gradient);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
        }
        .avatar-upload label:hover {
            transform: scale(1.1);
        }
        @media (max-width: 768px) {
            .avatar-upload {
                width: 120px;
                height: 120px;
            }
            .glass-card {
                padding: 1rem;
            }
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in {
            animation: fadeInUp 0.6s ease forwards;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-gray);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--light-blue);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-blue);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-brain me-2"></i>知识整理系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fas fa-home me-1"></i>首页</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-book me-1"></i>知识管理
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#"><i class="fas fa-list me-2"></i>知识列表</a></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-folder me-2"></i>分类管理</a></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-tags me-2"></i>标签管理</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fas fa-cloud-upload-alt me-1"></i>采集中心</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fas fa-calendar-check me-1"></i>复习计划</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fas fa-search me-1"></i>搜索</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle me-1"></i>个人中心
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item active" href="#"><i class="fas fa-user me-2"></i>个人资料</a></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-cog me-2"></i>设置</a></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-question-circle me-2"></i>帮助</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-sign-out-alt me-2"></i>退出登录</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container main-container">
        <div class="row mb-4 animate-fade-in">
            <div class="col-12">
                <div class="glass-card">
                    <h2 class="mb-2"><i class="fas fa-user me-2"></i>个人资料管理</h2>
                    <p class="text-muted mb-0">在这里您可以查看和编辑您的个人资料信息</p>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="glass-card animate-fade-in">
                    <form>
                        <div class="text-center mb-4">
                            <div class="avatar-upload">
                                <div class="avatar-preview">
                                    <i class="fas fa-user fa-3x"></i>
                                </div>
                                <input type="file" id="avatarUpload" accept="image/*">
                                <label for="avatarUpload" title="更换头像">
                                    <i class="fas fa-camera"></i>
                                </label>
                            </div>
                        </div>
                        <h5 class="mb-3"><i class="fas fa-info-circle me-2 text-primary"></i>基本信息</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="username" class="form-label">用户名</label>
                                <input type="text" class="form-control" id="username" value="张三" placeholder="请输入用户名">
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label">邮箱地址</label>
                                <input type="email" class="form-control" id="email" value="zhangsan@example.com" placeholder="请输入邮箱地址">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="phone" class="form-label">手机号码</label>
                                <input type="tel" class="form-control" id="phone" value="13800138000" placeholder="请输入手机号码">
                            </div>
                            <div class="col-md-6">
                                <label for="birthday" class="form-label">出生日期</label>
                                <input type="date" class="form-control" id="birthday" value="1995-06-15">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="bio" class="form-label">个人简介</label>
                            <textarea class="form-control" id="bio" rows="3" placeholder="请输入个人简介">热爱学习，专注于知识整理和分享</textarea>
                        </div>
                        <h5 class="mt-4 mb-3"><i class="fas fa-clock me-2 text-success"></i>学习偏好设置</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="studyTime" class="form-label">学习时间段</label>
                                <select class="form-select" id="studyTime">
                                    <option value="morning">上午 (9:00-12:00)</option>
                                    <option value="afternoon" selected>下午 (14:00-18:00)</option>
                                    <option value="evening">晚上 (19:00-22:00)</option>
                                    <option value="night">深夜 (22:00-02:00)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="reminderMethod" class="form-label">提醒方式</label>
                                <select class="form-select" id="reminderMethod">
                                    <option value="email">邮件提醒</option>
                                    <option value="sms" selected>短信提醒</option>
                                    <option value="app">应用内通知</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="studyGoal" class="form-label">学习目标</label>
                            <input type="text" class="form-control" id="studyGoal" value="掌握前端开发核心技能" placeholder="请输入学习目标">
                        </div>
                        <h5 class="mt-4 mb-3"><i class="fas fa-lock me-2 text-danger"></i>账号安全设置</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="currentPassword" class="form-label">当前密码</label>
                                <input type="password" class="form-control" id="currentPassword" placeholder="请输入当前密码">
                            </div>
                            <div class="col-md-6">
                                <label for="newPassword" class="form-label">新密码</label>
                                <input type="password" class="form-control" id="newPassword" placeholder="请输入新密码">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="confirmPassword" class="form-label">确认新密码</label>
                                <input type="password" class="form-control" id="confirmPassword" placeholder="请再次输入新密码">
                            </div>
                            <div class="col-md-6">
                                <label for="phoneVerification" class="form-label">手机验证</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="phoneVerification" placeholder="请输入验证码">
                                    <button class="btn btn-outline-primary" type="button">获取验证码</button>
                                </div>
                            </div>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>保存所有更改
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const avatarUpload = document.getElementById('avatarUpload');
            const avatarPreview = document.querySelector('.avatar-preview');
            avatarUpload.addEventListener('change', function(e) {
                if (this.files && this.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        avatarPreview.innerHTML = `<img src="${e.target.result}" alt="头像" style="width:100%;height:100%;border-radius:50%;">`;
                    }
                    reader.readAsDataURL(this.files[0]);
                }
            });
            const form = document.querySelector('form');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    alert('个人资料已保存成功！');
                });
            }
            const getVerificationBtn = document.querySelector('.btn-outline-primary');
            if (getVerificationBtn) {
                getVerificationBtn.addEventListener('click', function() {
                    const phoneInput = document.getElementById('phone');
                    if (phoneInput.value) {
                        alert('验证码已发送至 ' + phoneInput.value);
                    } else {
                        alert('请先填写手机号码');
                    }
                });
            }
        });
    </script>
</body>
</html>
