<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代码片段上传 - 内容感知智能代码片段管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --primary-blue: #4f46e5;
            --secondary-blue: #6366f1;
            --accent-purple: #8b5cf6;
            --success-green: #10b981;
            --warning-orange: #f59e0b;
            --error-red: #ef4444;
            --bg-light: #f8fafc;
            --bg-gray: #f1f5f9;
            --text-dark: #1e293b;
            --text-gray: #475569;
            --text-light: #64748b;
            --border-light: #e2e8f0;
            --border-gray: #cbd5e1;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-light);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .nav-link {
            color: var(--text-gray);
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
        }
        .nav-link:hover {
            color: var(--primary-blue);
            background: rgba(79, 70, 229, 0.1);
            transform: translateY(-2px);
        }
        .nav-link.active {
            color: var(--primary-blue);
            background: rgba(79, 70, 229, 0.1);
        }
        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -1rem;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background: var(--primary-gradient);
            border-radius: 3px;
        }
        .notification-badge {
            position: relative;
        }
        .notification-badge .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--error-red);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }
        .user-dropdown {
            position: relative;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-light);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .user-avatar:hover {
            border-color: var(--primary-blue);
            transform: scale(1.05);
        }
        .main-content {
            padding: 2rem 0;
            min-height: calc(100vh - 80px);
        }
        .dashboard-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 1.5rem;
            transition: all 0.3s ease;
            height: 100%;
        }
        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        }
        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .card-title i {
            color: var(--primary-blue);
        }
        .upload-area {
            border: 2px dashed var(--border-light);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(241, 245, 249, 0.5);
        }
        .upload-area:hover {
            border-color: var(--primary-blue);
            background: rgba(79, 70, 229, 0.05);
        }
        .upload-area i {
            font-size: 3rem;
            color: var(--primary-blue);
            margin-bottom: 1rem;
        }
        .upload-area h5 {
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }
        .upload-area p {
            color: var(--text-light);
            margin-bottom: 1rem;
        }
        .file-input {
            display: none;
        }
        .btn-upload {
            background: var(--primary-gradient);
            border: none;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        .progress {
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }
        .progress-bar {
            background: var(--primary-gradient);
        }
        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 0.25rem rgba(79, 70, 229, 0.25);
        }
        .form-select:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 0.25rem rgba(79, 70, 229, 0.25);
        }
        .language-tag {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
        }
        .language-tag:hover {
            transform: scale(1.05);
        }
        .lang-python { background: rgba(52, 152, 219, 0.1); color: #3498db; }
        .lang-javascript { background: rgba(241, 196, 15, 0.1); color: #f1c40f; }
        .lang-java { background: rgba(231, 76, 60, 0.1); color: #e74c3c; }
        .lang-typescript { background: rgba(52, 73, 94, 0.1); color: #34495e; }
        .lang-go { background: rgba(46, 204, 113, 0.1); color: #2ecc71; }
        @media (max-width: 768px) {
            .upload-area {
                padding: 2rem 1rem;
            }
            .upload-area i {
                font-size: 2rem;
            }
        }
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-code"></i>
                CodeAI Manager
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="fas fa-home"></i> 首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="code-library.html">
                            <i class="fas fa-folder"></i> 代码库
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="upload.html">
                            <i class="fas fa-upload"></i> 上传/编辑
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="search.html">
                            <i class="fas fa-search"></i> 搜索
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="tags.html">
                            <i class="fas fa-tags"></i> 标签管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">
                            <i class="fas fa-user"></i> 个人资料
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <div class="notification-badge">
                        <a href="#" class="text-decoration-none text-dark">
                            <i class="fas fa-bell fa-lg"></i>
                            <span class="badge">3</span>
                        </a>
                    </div>
                    <div class="dropdown user-dropdown">
                        <img src="https://picsum.photos/seed/user123/100/100" alt="用户头像" class="user-avatar" data-bs-toggle="dropdown">
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#"><i class="fas fa-cog"></i> 设置</a></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-question-circle"></i> 帮助</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#"><i class="fas fa-sign-out-alt"></i> 退出登录</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <div class="main-content">
        <div class="container">
            <div class="row mb-4">
                <div class="col-12">
                    <h1 class="display-5 fw-bold mb-2">上传代码片段</h1>
                    <p class="text-muted">将您的代码文件上传到系统中，支持多种编程语言和格式</p>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-8">
                    <div class="dashboard-card">
                        <h5 class="card-title">
                            <i class="fas fa-cloud-upload-alt"></i>
                            上传代码文件
                        </h5>
                        <div class="upload-area mb-4" id="dropArea">
                            <i class="fas fa-file-upload"></i>
                            <h5>拖拽文件到这里</h5>
                            <p>或点击选择文件</p>
                            <button class="btn btn-upload">选择文件</button>
                            <input type="file" id="fileInput" class="file-input" multiple accept=".py,.js,.java,.ts,.go,.cpp,.c,.rb,.php,.html,.css,.sql,.sh,.pl">
                        </div>
                        <div id="fileList" class="mb-4">
                            <h6>待上传文件：</h6>
                            <div class="list-group" id="fileListContainer">
                            </div>
                        </div>
                        <div id="uploadProgress" class="mb-4 d-none">
                            <h6>上传进度</h6>
                            <div class="progress mb-2">
                                <div class="progress-bar" role="progressbar" style="width: 0%"></div>
                            </div>
                            <div class="text-center">
                                <span id="progressText">准备上传...</span>
                            </div>
                        </div>
                        <button id="uploadBtn" class="btn btn-success btn-lg w-100 mt-3">
                            <i class="fas fa-upload"></i> 开始上传
                        </button>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="dashboard-card">
                        <h5 class="card-title">
                            <i class="fas fa-info-circle"></i>
                            代码元数据
                        </h5>
                        <form id="metadataForm">
                            <div class="mb-3">
                                <label for="codeTitle" class="form-label">代码标题 *</label>
                                <input type="text" class="form-control" id="codeTitle" placeholder="请输入代码标题" required>
                            </div>
                            <div class="mb-3">
                                <label for="codeDescription" class="form-label">代码描述</label>
                                <textarea class="form-control" id="codeDescription" rows="3" placeholder="请输入代码描述..."></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="programmingLanguage" class="form-label">编程语言 *</label>
                                <select class="form-select" id="programmingLanguage" required>
                                    <option value="">请选择编程语言</option>
                                    <option value="python">Python</option>
                                    <option value="javascript">JavaScript</option>
                                    <option value="java">Java</option>
                                    <option value="typescript">TypeScript</option>
                                    <option value="go">Go</option>
                                    <option value="cpp">C++</option>
                                    <option value="c">C</option>
                                    <option value="ruby">Ruby</option>
                                    <option value="php">PHP</option>
                                    <option value="html">HTML/CSS</option>
                                    <option value="sql">SQL</option>
                                    <option value="shell">Shell脚本</option>
                                    <option value="perl">Perl</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="tags" class="form-label">标签</label>
                                <input type="text" class="form-control" id="tags" placeholder="用逗号分隔多个标签">
                                <div class="mt-2">
                                    <span class="language-tag lang-python">Python</span>
                                    <span class="language-tag lang-javascript">JavaScript</span>
                                    <span class="language-tag lang-java">Java</span>
                                    <span class="language-tag lang-typescript">TypeScript</span>
                                    <span class="language-tag lang-go">Go</span>
                                </div>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="isPublic">
                                <label class="form-check-label" for="isPublic">公开可见</label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-save"></i> 保存元数据
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const dropArea = document.getElementById('dropArea');
        const fileInput = document.getElementById('fileInput');
        const fileListContainer = document.getElementById('fileListContainer');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadProgress = document.getElementById('uploadProgress');
        const progressBar = document.querySelector('.progress-bar');
        const progressText = document.getElementById('progressText');
        const metadataForm = document.getElementById('metadataForm');
        let files = [];
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
        });
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, highlight, false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, unhighlight, false);
        });
        function highlight() {
            dropArea.style.borderColor = '#4f46e5';
            dropArea.style.backgroundColor = 'rgba(79, 70, 229, 0.05)';
        }
        function unhighlight() {
            dropArea.style.borderColor = '#e2e8f0';
            dropArea.style.backgroundColor = 'rgba(241, 245, 249, 0.5)';
        }
        dropArea.addEventListener('drop', handleDrop, false);
        function handleDrop(e) {
            const dt = e.dataTransfer;
            const newFiles = Array.from(dt.files);
            addFiles(newFiles);
        }
        document.querySelector('.btn-upload').addEventListener('click', () => {
            fileInput.click();
        });
        fileInput.addEventListener('change', function() {
            const newFiles = Array.from(this.files);
            addFiles(newFiles);
        });
        function addFiles(newFiles) {
            newFiles.forEach(file => {
                if (!files.some(f => f.name === file.name && f.size === file.size)) {
                    files.push(file);
                    renderFileList();
                }
            });
        }
        function renderFileList() {
            fileListContainer.innerHTML = '';
            files.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'list-group-item d-flex justify-content-between align-items-center';
                fileItem.innerHTML = `
                    <div>
                        <i class="fas fa-file-code me-2 text-primary"></i>
                        <span>${file.name}</span>
                    </div>
                    <button class="btn btn-sm btn-outline-danger" onclick="removeFile(${index})">
                        <i class="fas fa-trash"></i>
                    </button>
                `;
                fileListContainer.appendChild(fileItem);
            });
        }
        function removeFile(index) {
            files.splice(index, 1);
            renderFileList();
        }
        uploadBtn.addEventListener('click', uploadFiles);
        function uploadFiles() {
            if (files.length === 0) {
                alert('请先选择要上传的文件');
                return;
            }
            uploadProgress.classList.remove('d-none');
            progressText.textContent = '开始上传...';
            progressBar.style.width = '0%';
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 10;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    progressText.textContent = '上传完成！';
                    setTimeout(() => {
                        alert('文件上传成功！');
                        files = [];
                        renderFileList();
                        uploadProgress.classList.add('d-none');
                    }, 500);
                }
                progressBar.style.width = `${progress}%`;
                progressText.textContent = `上传中... ${Math.round(progress)}%`;
            }, 200);
        }
        metadataForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('codeTitle').value;
            const description = document.getElementById('codeDescription').value;
            const language = document.getElementById('programmingLanguage').value;
            const tags = document.getElementById('tags').value;
            if (!title || !language) {
                alert('请填写必填字段（标题和编程语言）');
                return;
            }
            alert(`元数据保存成功！\n标题: ${title}\n语言: ${language}\n标签: ${tags}`);
        });
        document.addEventListener('DOMContentLoaded', function() {
        });
    </script>
</body>
</html>
