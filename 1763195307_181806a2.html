<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可视化分析报告 - 缺陷预测系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --primary-blue: #4f46e5;
            --secondary-blue: #6366f1;
            --accent-purple: #8b5cf6;
            --success-green: #10b981;
            --warning-orange: #f59e0b;
            --error-red: #ef4444;
            --bg-light: #f8fafc;
            --bg-card: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
            padding: 1rem 0;
            transition: all 0.3s ease;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .nav-link {
            color: var(--text-secondary);
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
        }
        .nav-link:hover {
            color: var(--primary-blue);
            background: rgba(79, 70, 229, 0.1);
        }
        .nav-link.active {
            color: white;
            background: var(--primary-gradient);
        }
        .dashboard-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 1.5rem;
            transition: all 0.3s ease;
            height: 100%;
        }
        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .card-title i {
            color: var(--accent-purple);
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            border-left: 4px solid;
        }
        .stat-card:hover {
            transform: translateX(5px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.12);
        }
        .stat-card.primary {
            border-left-color: var(--primary-blue);
        }
        .stat-card.success {
            border-left-color: var(--success-green);
        }
        .stat-card.warning {
            border-left-color: var(--warning-orange);
        }
        .stat-card.danger {
            border-left-color: var(--error-red);
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin: 0.5rem 0;
        }
        .stat-label {
            color: var(--text-muted);
            font-size: 0.875rem;
        }
        .stat-change {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            padding: 0.25rem 0.5rem;
            border-radius: 20px;
        }
        .stat-change.up {
            color: var(--success-green);
            background: rgba(16, 185, 129, 0.1);
        }
        .stat-change.down {
            color: var(--error-red);
            background: rgba(239, 68, 68, 0.1);
        }
        .quick-action-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
            background: white;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        .quick-action-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            color: var(--primary-blue);
            text-decoration: none;
        }
        .quick-action-btn i {
            font-size: 2rem;
            margin-bottom: 0.75rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .task-item {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            background: white;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .task-item:hover {
            background: var(--bg-card);
            transform: translateX(5px);
        }
        .task-priority {
            width: 4px;
            height: 40px;
            border-radius: 2px;
            margin-right: 1rem;
        }
        .task-priority.high {
            background: var(--error-red);
        }
        .task-priority.medium {
            background: var(--warning-orange);
        }
        .task-priority.low {
            background: var(--success-green);
        }
        .notification-item {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            background: white;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            border-left: 3px solid;
            transition: all 0.3s ease;
        }
        .notification-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .notification-item.error {
            border-left-color: var(--error-red);
        }
        .notification-item.warning {
            border-left-color: var(--warning-orange);
        }
        .notification-item.info {
            border-left-color: var(--primary-blue);
        }
        .resource-bar {
            height: 8px;
            background: var(--bg-card);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        .resource-progress {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        .resource-progress.normal {
            background: linear-gradient(90deg, #10b981, #34d399);
        }
        .resource-progress.warning {
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
        }
        .resource-progress.danger {
            background: linear-gradient(90deg, #ef4444, #f87171);
        }
        @media (max-width: 768px) {
            .dashboard-card {
                margin-bottom: 1rem;
            }
            .stat-value {
                font-size: 1.5rem;
            }
            .quick-action-btn {
                padding: 1rem;
            }
            .quick-action-btn i {
                font-size: 1.5rem;
            }
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .loading {
            animation: pulse 1.5s infinite;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#">
                <i class="fas fa-chart-line me-2"></i>缺陷预测系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fas fa-home me-1"></i>首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fas fa-database me-1"></i>数据管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fas fa-brain me-1"></i>模型管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fas fa-bug me-1"></i>预测中心</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#"><i class="fas fa-chart-pie me-1"></i>分析报告</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fas fa-cog me-1"></i>系统管理</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container-fluid px-4 py-4">
        <div class="row g-4">
            <div class="col-12">
                <div class="dashboard-card">
                    <div class="card-title">
                        <i class="fas fa-filter"></i>
                        自定义筛选条件
                    </div>
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">时间范围</label>
                            <select class="form-select">
                                <option>最近7天</option>
                                <option>最近30天</option>
                                <option>最近90天</option>
                                <option>自定义日期</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">缺陷类别</label>
                            <select class="form-select">
                                <option>全部类别</option>
                                <option>严重缺陷</option>
                                <option>一般缺陷</option>
                                <option>轻微缺陷</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">模型版本</label>
                            <select class="form-select">
                                <option>最新版本</option>
                                <option>v1.2</option>
                                <option>v1.1</option>
                                <option>v1.0</option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex align-items-end">
                            <button class="btn btn-primary w-100">
                                <i class="fas fa-sync-alt me-1"></i>刷新图表
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row g-4 mt-2">
            <div class="col-lg-6">
                <div class="dashboard-card">
                    <div class="card-title">
                        <i class="fas fa-th-large"></i>
                        混淆矩阵
                    </div>
                    <div class="text-center">
                        <canvas id="confusionMatrixChart" height="300"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="dashboard-card">
                    <div class="card-title">
                        <i class="fas fa-chart-pie"></i>
                        缺陷分布饼图
                    </div>
                    <div class="text-center">
                        <canvas id="defectDistributionChart" height="300"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="row g-4 mt-2">
            <div class="col-lg-8">
                <div class="dashboard-card">
                    <div class="card-title">
                        <i class="fas fa-chart-line"></i>
                        缺陷时间趋势
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <canvas id="timeTrendChart" height="300"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="dashboard-card">
                    <div class="card-title">
                        <i class="fas fa-tachometer-alt"></i>
                        模型性能对比
                    </div>
                    <div class="row g-3">
                        <div class="col-12">
                            <div class="text-center p-3 bg-light rounded">
                                <div class="stat-value text-primary">94.2%</div>
                                <div class="stat-label">准确率</div>
                                <div class="progress mt-2" style="height: 8px;">
                                    <div class="progress-bar bg-primary" role="progressbar" style="width: 94.2%"></div>
                                </div>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="text-center p-3 bg-light rounded">
                                <div class="stat-value text-success">89.7%</div>
                                <div class="stat-label">召回率</div>
                                <div class="progress mt-2" style="height: 8px;">
                                    <div class="progress-bar bg-success" role="progressbar" style="width: 89.7%"></div>
                                </div>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="text-center p-3 bg-light rounded">
                                <div class="stat-value text-info">91.8%</div>
                                <div class="stat-label">F1分数</div>
                                <div class="progress mt-2" style="height: 8px;">
                                    <div class="progress-bar bg-info" role="progressbar" style="width: 91.8%"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row g-4 mt-2">
            <div class="col-12">
                <div class="dashboard-card">
                    <div class="card-title">
                        <i class="fas fa-lightbulb"></i>
                        AI驱动的数据洞察
                    </div>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <div class="p-3 border rounded">
                                <h6><i class="fas fa-bolt text-warning me-2"></i>关键发现</h6>
                                <p class="mb-0">近期严重缺陷数量增加23%，建议加强代码审查流程。</p>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-3 border rounded">
                                <h6><i class="fas fa-chart-line text-primary me-2"></i>趋势分析</h6>
                                <p class="mb-0">轻微缺陷占比持续下降，说明质量控制措施有效。</p>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-3 border rounded">
                                <h6><i class="fas fa-shield-alt text-success me-2"></i>风险预警</h6>
                                <p class="mb-0">模型准确率已达到94.2%，接近最优水平。</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row g-4 mt-2">
            <div class="col-12">
                <div class="dashboard-card">
                    <div class="card-title">
                        <i class="fas fa-download"></i>
                        报告导出与生成
                    </div>
                    <div class="row g-3">
                        <div class="col-md-3">
                            <button class="btn btn-outline-primary w-100">
                                <i class="fas fa-file-pdf me-2"></i>导出PDF报告
                            </button>
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-outline-success w-100">
                                <i class="fas fa-file-image me-2"></i>导出PNG图表
                            </button>
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-outline-info w-100">
                                <i class="fas fa-file-alt me-2"></i>生成HTML报告
                            </button>
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-outline-secondary w-100">
                                <i class="fas fa-cogs me-2"></i>自动报告生成
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const confusionMatrixCtx = document.getElementById('confusionMatrixChart').getContext('2d');
        new Chart(confusionMatrixCtx, {
            type: 'bar',
            data: {
                labels: ['预测值: 严重', '预测值: 一般', '预测值: 轻微'],
                datasets: [{
                    label: '实际值: 严重',
                    data: [120, 15, 5],
                    backgroundColor: '#ef4444'
                }, {
                    label: '实际值: 一般',
                    data: [10, 280, 30],
                    backgroundColor: '#f59e0b'
                }, {
                    label: '实际值: 轻微',
                    data: [5, 20, 340],
                    backgroundColor: '#10b981'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return context.dataset.label + ': ' + context.parsed.y;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        stacked: true,
                    },
                    y: {
                        stacked: true,
                        beginAtZero: true
                    }
                }
            }
        });
        const defectDistributionCtx = document.getElementById('defectDistributionChart').getContext('2d');
        new Chart(defectDistributionCtx, {
            type: 'pie',
            data: {
                labels: ['严重缺陷', '一般缺陷', '轻微缺陷'],
                datasets: [{
                    data: [127, 342, 589],
                    backgroundColor: [
                        '#ef4444',
                        '#f59e0b',
                        '#10b981'
                    ],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            padding: 15,
                            font: {
                                size: 12
                            }
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                const percentage = ((context.parsed / total) * 100).toFixed(1);
                                return context.label + ': ' + context.parsed + ' (' + percentage + '%)';
                            }
                        }
                    }
                }
            }
        });
        const timeTrendCtx = document.getElementById('timeTrendChart').getContext('2d');
        new Chart(timeTrendCtx, {
            type: 'line',
            data: {
                labels: ['1月', '2月', '3月', '4月', '5月', '6月', '7月'],
                datasets: [{
                    label: '严重缺陷',
                    data: [120, 110, 130, 140, 125, 135, 145],
                    borderColor: '#ef4444',
                    backgroundColor: 'rgba(239, 68, 68, 0.1)',
                    tension: 0.4,
                    fill: true
                }, {
                    label: '一般缺陷',
                    data: [300, 320, 310, 330, 340, 335, 350],
                    borderColor: '#f59e0b',
                    backgroundColor: 'rgba(245, 158, 11, 0.1)',
                    tension: 0.4,
                    fill: true
                }, {
                    label: '轻微缺陷',
                    data: [500, 520, 510, 530, 540, 535, 550],
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.1)',
                    tension: 0.4,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            color: 'rgba(0, 0, 0, 0.05)'
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        }
                    }
                }
            }
        });
        document.addEventListener('DOMContentLoaded', function() {
            const refreshBtn = document.querySelector('.btn-primary');
            refreshBtn.addEventListener('click', function() {
                this.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>刷新中...';
                setTimeout(() => {
                    this.innerHTML = '<i class="fas fa-sync-alt me-1"></i>刷新图表';
                }, 1500);
            });
            const exportButtons = document.querySelectorAll('.btn-outline-primary, .btn-outline-success, .btn-outline-info, .btn-outline-secondary');
            exportButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    this.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>处理中...';
                    setTimeout(() => {
                        this.innerHTML = this.innerHTML.replace('<i class="fas fa-spinner fa-spin me-1"></i>处理中...', this.innerHTML.includes('PDF') ? '<i class="fas fa-file-pdf me-2"></i>导出PDF报告' : 
                            this.innerHTML.includes('PNG') ? '<i class="fas fa-file-image me-2"></i>导出PNG图表' :
                            this.innerHTML.includes('HTML') ? '<i class="fas fa-file-alt me-2"></i>生成HTML报告' : '<i class="fas fa-cogs me-2"></i>自动报告生成');
                    }, 1500);
                });
            });
        });
    </script>
</body>
</html>
