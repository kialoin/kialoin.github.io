<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 数据分析平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --primary-blue: #4f46e5;
            --secondary-blue: #6366f1;
            --purple: #8b5cf6;
            --success-green: #10b981;
            --warning-orange: #f59e0b;
            --error-red: #ef4444;
            --bg-light: #f8fafc;
            --bg-secondary: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --border-medium: #cbd5e1;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            max-width: 450px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2.5rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-light);
            position: relative;
            overflow: hidden;
        }
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--primary-gradient);
        }
        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo {
            font-size: 2.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .login-tabs {
            display: flex;
            margin-bottom: 1.5rem;
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg-secondary);
        }
        .tab-btn {
            flex: 1;
            padding: 0.8rem 0;
            border: none;
            background: transparent;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .tab-btn.active {
            color: var(--primary-blue);
            background: white;
            font-weight: 600;
        }
        .tab-btn:not(.active):hover {
            background: rgba(79, 70, 229, 0.05);
        }
        .tab-indicator {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary-blue);
            transition: all 0.3s ease;
        }
        .form-container {
            margin-bottom: 1.5rem;
        }
        .form-control {
            border: 2px solid var(--border-light);
            border-radius: 10px;
            padding: 12px 15px;
            transition: all 0.3s ease;
            background: white;
        }
        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            outline: none;
        }
        .form-check-input {
            border-radius: 6px;
        }
        .form-check-input:checked {
            background-color: var(--primary-blue);
            border-color: var(--primary-blue);
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            border: none;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-wecom {
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 1rem;
        }
        .btn-wecom:hover {
            background: #219653;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(39, 174, 96, 0.3);
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-light);
        }
        .divider-text {
            padding: 0 1rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-secondary);
        }
        .register-link a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 500;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            color: var(--error-red);
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }
        .wecom-qrcode {
            display: none;
            text-align: center;
            margin: 1.5rem 0;
        }
        .qrcode-placeholder {
            width: 200px;
            height: 200px;
            border: 1px dashed var(--border-medium);
            border-radius: 10px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .social-login {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: none;
            transition: all 0.3s ease;
        }
        .social-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        @media (max-width: 576px) {
            .login-container {
                padding: 1.5rem;
                margin: 10px;
            }
            .logo {
                font-size: 2rem;
            }
            .logo-text {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-container">
            <div class="logo">
                <i class="fas fa-chart-line"></i>
            </div>
            <div class="logo-text">数据分析平台</div>
        </div>
        <div class="login-tabs">
            <button class="tab-btn active" data-tab="password">
                账号密码登录
            </button>
            <button class="tab-btn" data-tab="wecom">
                企业微信登录
            </button>
            <div class="tab-indicator"></div>
        </div>
        <div class="form-container" id="passwordForm">
            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">用户名</label>
                    <input type="text" class="form-control" id="username" placeholder="请输入用户名" required>
                    <div class="error-message" id="username-error">请输入有效的用户名</div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">密码</label>
                    <input type="password" class="form-control" id="password" placeholder="请输入密码" required>
                    <div class="error-message" id="password-error">密码不能为空</div>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">记住密码</label>
                </div>
                <button type="submit" class="btn btn-login" style="background: var(--primary-gradient);">
                    登录
                </button>
            </form>
        </div>
        <div class="form-container d-none" id="wecomForm">
            <div class="wecom-qrcode">
                <div class="qrcode-placeholder">
                    <i class="fas fa-qrcode fa-2x"></i>
                </div>
                <p class="mt-2">请使用企业微信扫描二维码登录</p>
                <p class="text-muted small">二维码将在30秒后过期</p>
            </div>
            <button class="btn btn-wecom" id="wecomLoginBtn">
                <i class="fab fa-weixin me-2"></i>企业微信扫码登录
            </button>
            <div class="divider">
                <span class="divider-text">或</span>
            </div>
            <p class="text-center text-muted small">
                如需企业微信登录，请联系管理员开通权限
            </p>
        </div>
        <div class="register-link">
            还没有账号？<a href="#">立即注册</a>
        </div>
        <div class="social-login">
            <button class="social-btn">
                <i class="fab fa-weixin"></i>
            </button>
            <button class="social-btn">
                <i class="fab fa-github"></i>
            </button>
            <button class="social-btn">
                <i class="fab fa-google"></i>
            </button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('.tab-btn').forEach(tab => {
            tab.addEventListener('click', function() {
                const tabType = this.getAttribute('data-tab');
                document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('passwordForm').classList.toggle('d-none', tabType !== 'password');
                document.getElementById('wecomForm').classList.toggle('d-none', tabType !== 'wecom');
                const indicator = document.querySelector('.tab-indicator');
                indicator.style.left = this.offsetLeft + 'px';
                indicator.style.width = this.offsetWidth + 'px';
            });
        });
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let isValid = true;
            const username = document.getElementById('username').value.trim();
            const usernameError = document.getElementById('username-error');
            if (!username || username.length < 3) {
                usernameError.style.display = 'block';
                isValid = false;
            } else {
                usernameError.style.display = 'none';
            }
            const password = document.getElementById('password').value;
            const passwordError = document.getElementById('password-error');
            if (!password || password.length < 6) {
                passwordError.style.display = 'block';
                isValid = false;
            } else {
                passwordError.style.display = 'none';
            }
            if (isValid) {
                const loginBtn = this.querySelector('.btn-login');
                const originalText = loginBtn.innerHTML;
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>登录中...';
                loginBtn.disabled = true;
                setTimeout(() => {
                    alert('登录成功！欢迎回来！');
                    loginBtn.innerHTML = originalText;
                    loginBtn.disabled = false;
                }, 1500);
            }
        });
        document.getElementById('wecomLoginBtn').addEventListener('click', function() {
            const qrcodeDiv = document.querySelector('.wecom-qrcode');
            qrcodeDiv.style.display = 'block';
            this.disabled = true;
            setTimeout(() => {
                alert('二维码已生成，请使用企业微信扫描');
            }, 500);
        });
        document.addEventListener('DOMContentLoaded', function() {
            const activeTab = document.querySelector('.tab-btn.active');
            const indicator = document.querySelector('.tab-indicator');
            indicator.style.left = activeTab.offsetLeft + 'px';
            indicator.style.width = activeTab.offsetWidth + 'px';
        });
    </script>
</body>
</html>
