<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 日志分析系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            background-color: #f5f7fa;
            color: #333;
        }
        .navbar {
            background-color: #fff;
            border-bottom: 1px solid #e0e6ed;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar-brand {
            font-size: 18px;
            font-weight: 600;
            color: #1e88e5;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar-menu {
            display: flex;
            list-style: none;
            gap: 32px;
        }
        .navbar-menu li {
            position: relative;
        }
        .navbar-menu a {
            text-decoration: none;
            color: #606266;
            font-size: 14px;
            padding: 8px 0;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s;
        }
        .navbar-menu a:hover {
            color: #1e88e5;
        }
        .navbar-menu a.active {
            color: #1e88e5;
            font-weight: 600;
        }
        .dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #fff;
            border: 1px solid #e0e6ed;
            min-width: 160px;
            display: none;
            margin-top: 4px;
        }
        .navbar-menu li:hover .dropdown {
            display: block;
        }
        .dropdown a {
            padding: 10px 16px;
            display: block;
            border-bottom: 1px solid #f0f2f5;
        }
        .dropdown a:last-child {
            border-bottom: none;
        }
        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .user-dropdown {
            position: relative;
        }
        .user-dropdown-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 12px;
            background-color: #f5f7fa;
            border: 1px solid #e0e6ed;
            border-radius: 2px;
            font-size: 14px;
            color: #606266;
        }
        .user-dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background-color: #fff;
            border: 1px solid #e0e6ed;
            min-width: 160px;
            display: none;
            margin-top: 4px;
        }
        .user-dropdown:hover .user-dropdown-menu {
            display: block;
        }
        .main-container {
            padding: 24px;
            max-width: 1440px;
            margin: 0 auto;
        }
        .register-form {
            background-color: #fff;
            border: 1px solid #e0e6ed;
            padding: 32px;
            border-radius: 4px;
            max-width: 500px;
            margin: 0 auto;
        }
        .form-title {
            font-size: 20px;
            font-weight: 600;
            color: #303133;
            margin-bottom: 24px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #606266;
            margin-bottom: 8px;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dcdfe6;
            font-size: 14px;
            color: #606266;
            background-color: #fff;
            outline: none;
            border-radius: 2px;
        }
        .form-control:focus {
            border-color: #1e88e5;
        }
        .captcha-container {
            display: flex;
            gap: 12px;
        }
        .captcha-input {
            flex: 1;
        }
        .captcha-image {
            width: 120px;
            height: 40px;
            border: 1px solid #dcdfe6;
            background-color: #f5f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            user-select: none;
        }
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 20px;
        }
        .checkbox-group input {
            margin-top: 2px;
        }
        .checkbox-group label {
            font-size: 14px;
            color: #606266;
            line-height: 1.5;
        }
        .checkbox-group a {
            color: #1e88e5;
            text-decoration: none;
        }
        .checkbox-group a:hover {
            text-decoration: underline;
        }
        .btn-primary {
            width: 100%;
            background-color: #1e88e5;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
            border-radius: 2px;
        }
        .btn-primary:hover {
            background-color: #1976d2;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #606266;
        }
        .login-link a {
            color: #1e88e5;
            text-decoration: none;
            margin-left: 4px;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        @media (max-width: 768px) {
            .navbar-menu {
                display: none;
            }
            .register-form {
                margin: 16px;
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <i class="fas fa-chart-line"></i>
            日志分析系统
        </div>
        <ul class="navbar-menu">
            <li>
                <a href="index.html">
                    <i class="fas fa-home"></i>
                    首页
                </a>
            </li>
            <li>
                <a href="log_management.html">
                    <i class="fas fa-file-alt"></i>
                    日志管理
                    <i class="fas fa-chevron-down" style="font-size: 12px;"></i>
                </a>
                <div class="dropdown">
                    <a href="data_import.html"><i class="fas fa-upload"></i> 数据导入</a>
                    <a href="query_analysis.html"><i class="fas fa-search"></i> 查询分析</a>
                </div>
            </li>
            <li>
                <a href="monitoring_center.html">
                    <i class="fas fa-desktop"></i>
                    监控中心
                </a>
            </li>
            <li>
                <a href="visualization.html">
                    <i class="fas fa-chart-bar"></i>
                    可视化配置
                </a>
            </li>
            <li>
                <a href="security.html">
                    <i class="fas fa-shield-alt"></i>
                    安全管理
                    <i class="fas fa-chevron-down" style="font-size: 12px;"></i>
                </a>
                <div class="dropdown">
                    <a href="permission.html"><i class="fas fa-users-cog"></i> 权限管理</a>
                    <a href="exception_report.html"><i class="fas fa-exclamation-triangle"></i> 异常报告</a>
                </div>
            </li>
            <li>
                <a href="system_settings.html" class="active">
                    <i class="fas fa-cog"></i>
                    系统设置
                </a>
            </li>
        </ul>
        <div class="user-menu">
            <div class="user-dropdown">
                <div class="user-dropdown-toggle">
                    <i class="fas fa-user-circle"></i>
                    <span>管理员</span>
                    <i class="fas fa-chevron-down" style="font-size: 12px;"></i>
                </div>
                <div class="user-dropdown-menu">
                    <a href="profile.html"><i class="fas fa-user"></i> 个人资料</a>
                    <a href="login.html"><i class="fas fa-sign-out-alt"></i> 退出登录</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="main-container">
        <div class="register-form">
            <div class="form-title">用户注册</div>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" class="form-control" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label for="email">邮箱地址</label>
                    <input type="email" id="email" class="form-control" placeholder="请输入邮箱地址" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" class="form-control" placeholder="请输入密码" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <input type="password" id="confirmPassword" class="form-control" placeholder="请再次输入密码" required>
                </div>
                <div class="form-group">
                    <label for="captcha">验证码</label>
                    <div class="captcha-container">
                        <input type="text" id="captcha" class="form-control captcha-input" placeholder="请输入验证码" required>
                        <div class="captcha-image">ABCD</div>
                    </div>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">我已阅读并同意 <a href="#">用户服务条款</a> 和 <a href="#">隐私政策</a></label>
                </div>
                <button type="submit" class="btn-primary">注册账户</button>
            </form>
            <div class="login-link">
                已有账户？<a href="login.html">立即登录</a>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const captcha = document.getElementById('captcha').value;
            if (password !== confirmPassword) {
                alert('两次输入的密码不一致！');
                return;
            }
            if (!username || !email || !password || !captcha) {
                alert('请填写所有必填字段！');
                return;
            }
            alert('注册成功！正在跳转到登录页面...');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1000);
        });
        document.querySelector('.captcha-image').addEventListener('click', function() {
            this.textContent = Math.random().toString(36).substring(2, 6).toUpperCase();
        });
    </script>
</body>
</html>
