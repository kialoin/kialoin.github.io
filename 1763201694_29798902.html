<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志数据导入 - 日志分析系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            background-color: #f5f7fa;
            color: #333;
        }
        .navbar {
            background-color: #fff;
            border-bottom: 1px solid #e0e6ed;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar-brand {
            font-size: 18px;
            font-weight: 600;
            color: #1e88e5;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar-menu {
            display: flex;
            list-style: none;
            gap: 32px;
        }
        .navbar-menu li {
            position: relative;
        }
        .navbar-menu a {
            text-decoration: none;
            color: #606266;
            font-size: 14px;
            padding: 8px 0;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s;
        }
        .navbar-menu a:hover {
            color: #1e88e5;
        }
        .navbar-menu a.active {
            color: #1e88e5;
            font-weight: 600;
        }
        .dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #fff;
            border: 1px solid #e0e6ed;
            min-width: 160px;
            display: none;
            margin-top: 4px;
        }
        .navbar-menu li:hover .dropdown {
            display: block;
        }
        .dropdown a {
            padding: 10px 16px;
            display: block;
            border-bottom: 1px solid #f0f2f5;
        }
        .dropdown a:last-child {
            border-bottom: none;
        }
        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .user-dropdown {
            position: relative;
        }
        .user-dropdown-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 12px;
            background-color: #f5f7fa;
            border: 1px solid #e0e6ed;
            border-radius: 2px;
            font-size: 14px;
            color: #606266;
        }
        .user-dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background-color: #fff;
            border: 1px solid #e0e6ed;
            min-width: 160px;
            display: none;
            margin-top: 4px;
        }
        .user-dropdown:hover .user-dropdown-menu {
            display: block;
        }
        .main-container {
            padding: 24px;
            max-width: 1440px;
            margin: 0 auto;
        }
        .filter-section {
            background-color: #fff;
            border: 1px solid #e0e6ed;
            padding: 16px 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .filter-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-item label {
            font-size: 14px;
            color: #606266;
        }
        .filter-item select,
        .filter-item input {
            padding: 6px 12px;
            border: 1px solid #dcdfe6;
            font-size: 14px;
            color: #606266;
            background-color: #fff;
            outline: none;
        }
        .filter-item select:focus,
        .filter-item input:focus {
            border-color: #1e88e5;
        }
        .btn-primary {
            background-color: #1e88e5;
            color: #fff;
            border: none;
            padding: 8px 20px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-primary:hover {
            background-color: #1976d2;
        }
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 24px;
            margin-bottom: 24px;
        }
        .card {
            background-color: #fff;
            border: 1px solid #e0e6ed;
            padding: 20px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
        }
        .card-subtitle {
            font-size: 12px;
            color: #909399;
            margin-top: 4px;
        }
        .upload-area {
            border: 2px dashed #dcdfe6;
            border-radius: 4px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 24px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .upload-area:hover {
            border-color: #1e88e5;
            background-color: #f8fbff;
        }
        .upload-area i {
            font-size: 48px;
            color: #1e88e5;
            margin-bottom: 16px;
        }
        .upload-area h3 {
            margin-bottom: 8px;
            color: #303133;
        }
        .upload-area p {
            color: #909399;
            margin-bottom: 16px;
        }
        .file-input {
            display: none;
        }
        .btn-secondary {
            background-color: #f5f7fa;
            color: #606266;
            border: 1px solid #dcdfe6;
            padding: 8px 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-secondary:hover {
            background-color: #e0e6ed;
        }
        .config-section {
            margin-bottom: 24px;
        }
        .config-item {
            margin-bottom: 16px;
        }
        .config-item label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #303133;
        }
        .config-item input,
        .config-item select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            border-radius: 2px;
            font-size: 14px;
            color: #606266;
        }
        .progress-bar {
            height: 8px;
            background-color: #f0f2f5;
            border-radius: 4px;
            overflow: hidden;
            margin: 16px 0;
        }
        .progress-fill {
            height: 100%;
            background-color: #1e88e5;
            width: 0%;
            transition: width 0.3s;
        }
        @media (max-width: 1200px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 768px) {
            .navbar-menu {
                display: none;
            }
            .filter-section {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <i class="fas fa-chart-line"></i>
            日志分析系统
        </div>
        <ul class="navbar-menu">
            <li>
                <a href="index.html">
                    <i class="fas fa-home"></i>
                    首页
                </a>
            </li>
            <li>
                <a href="log-management.html" class="active">
                    <i class="fas fa-file-alt"></i>
                    日志管理
                    <i class="fas fa-chevron-down" style="font-size: 12px;"></i>
                </a>
                <div class="dropdown">
                    <a href="log-import.html"><i class="fas fa-upload"></i> 数据导入</a>
                    <a href="log-query.html"><i class="fas fa-search"></i> 查询分析</a>
                </div>
            </li>
            <li>
                <a href="monitoring.html">
                    <i class="fas fa-desktop"></i>
                    监控中心
                </a>
            </li>
            <li>
                <a href="visualization.html">
                    <i class="fas fa-chart-bar"></i>
                    可视化配置
                </a>
            </li>
            <li>
                <a href="security.html">
                    <i class="fas fa-shield-alt"></i>
                    安全管理
                    <i class="fas fa-chevron-down" style="font-size: 12px;"></i>
                </a>
                <div class="dropdown">
                    <a href="permissions.html"><i class="fas fa-users-cog"></i> 权限管理</a>
                    <a href="reports.html"><i class="fas fa-exclamation-triangle"></i> 异常报告</a>
                </div>
            </li>
            <li>
                <a href="settings.html">
                    <i class="fas fa-cog"></i>
                    系统设置
                </a>
            </li>
        </ul>
        <div class="user-menu">
            <div class="user-dropdown">
                <div class="user-dropdown-toggle">
                    <i class="fas fa-user-circle"></i>
                    <span>管理员</span>
                    <i class="fas fa-chevron-down" style="font-size: 12px;"></i>
                </div>
                <div class="user-dropdown-menu">
                    <a href="#"><i class="fas fa-user"></i> 个人资料</a>
                    <a href="#"><i class="fas fa-sign-out-alt"></i> 退出登录</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="main-container">
        <div class="card" style="margin-bottom: 24px;">
            <div class="card-header">
                <div>
                    <div class="card-title">日志数据导入</div>
                    <div class="card-subtitle">支持多种格式文件批量导入或实时流输入</div>
                </div>
            </div>
        </div>
        <div class="card" style="margin-bottom: 24px;">
            <div class="card-header">
                <div class="card-title">文件上传</div>
            </div>
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <i class="fas fa-cloud-upload-alt"></i>
                <h3>拖拽文件到此处或点击上传</h3>
                <p>支持 JSON、CSV、Apache日志等格式文件</p>
                <button class="btn-secondary">
                    <i class="fas fa-folder-open"></i> 选择文件
                </button>
                <input type="file" id="fileInput" class="file-input" multiple accept=".json,.csv,.log">
            </div>
        </div>
        <div class="card config-section">
            <div class="card-header">
                <div class="card-title">数据源配置</div>
            </div>
            <div class="config-item">
                <label>数据源名称</label>
                <input type="text" placeholder="请输入数据源名称">
            </div>
            <div class="config-item">
                <label>数据格式</label>
                <select>
                    <option>JSON</option>
                    <option>CSV</option>
                    <option>Apache日志</option>
                    <option>NGINX日志</option>
                    <option>Windows事件日志</option>
                </select>
            </div>
            <div class="config-item">
                <label>解析规则</label>
                <input type="text" placeholder="自定义解析规则，如：timestamp,level,message">
            </div>
            <div class="config-item">
                <label>时间戳格式</label>
                <input type="text" placeholder="例如：yyyy-MM-dd HH:mm:ss">
            </div>
            <button class="btn-primary" style="margin-top: 16px;">
                <i class="fas fa-save"></i> 保存配置
            </button>
        </div>
        <div class="card">
            <div class="card-header">
                <div class="card-title">导入进度</div>
            </div>
            <div style="margin-bottom: 16px;">
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 65%;"></div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 12px; color: #909399;">
                    <span>已处理 65%</span>
                    <span>预计剩余时间：2分30秒</span>
                </div>
            </div>
            <div style="background-color: #f8fbff; padding: 16px; border-radius: 4px; margin-bottom: 16px;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                    <span style="font-weight: 500;">当前状态：</span>
                    <span style="color: #1e88e5;">数据清洗中...</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                    <span style="font-weight: 500;">处理文件：</span>
                    <span>app-server-2023-12-01.log</span>
                </div>
                <div style="display: flex; justify-content: space-between;">
                    <span style="font-weight: 500;">处理记录：</span>
                    <span>12,456 / 28,934 条</span>
                </div>
            </div>
            <button class="btn-primary">
                <i class="fas fa-play"></i> 开始导入
            </button>
        </div>
    </div>
    <script>
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = e.target.files;
            if (files.length > 0) {
                alert(`已选择 ${files.length} 个文件`);
            }
        });
        function updateProgress() {
            const progressFill = document.querySelector('.progress-fill');
            let width = parseInt(progressFill.style.width) || 0;
            if (width < 100) {
                width += 1;
                progressFill.style.width = width + '%';
                setTimeout(updateProgress, 100);
            }
        }
        window.addEventListener('load', function() {
            setTimeout(updateProgress, 2000);
        });
    </script>
</body>
</html>
