<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置 - 日志分析系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            background-color: #f5f7fa;
            color: #333;
        }
        .navbar {
            background-color: #fff;
            border-bottom: 1px solid #e0e6ed;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .navbar-brand {
            font-size: 18px;
            font-weight: 600;
            color: #1e88e5;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .navbar-menu {
            display: flex;
            list-style: none;
            gap: 32px;
        }
        .navbar-menu li {
            position: relative;
        }
        .navbar-menu a {
            text-decoration: none;
            color: #606266;
            font-size: 14px;
            padding: 8px 0;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s;
        }
        .navbar-menu a:hover {
            color: #1e88e5;
        }
        .navbar-menu a.active {
            color: #1e88e5;
            font-weight: 600;
        }
        .dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #fff;
            border: 1px solid #e0e6ed;
            min-width: 160px;
            display: none;
            margin-top: 4px;
        }
        .navbar-menu li:hover .dropdown {
            display: block;
        }
        .dropdown a {
            padding: 10px 16px;
            display: block;
            border-bottom: 1px solid #f0f2f5;
        }
        .dropdown a:last-child {
            border-bottom: none;
        }
        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .user-dropdown {
            position: relative;
        }
        .user-dropdown-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px 12px;
            background-color: #f5f7fa;
            border: 1px solid #e0e6ed;
            border-radius: 2px;
            font-size: 14px;
            color: #606266;
        }
        .user-dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background-color: #fff;
            border: 1px solid #e0e6ed;
            min-width: 160px;
            display: none;
            margin-top: 4px;
        }
        .user-dropdown:hover .user-dropdown-menu {
            display: block;
        }
        .main-container {
            padding: 24px;
            max-width: 1440px;
            margin: 0 auto;
        }
        .filter-section {
            background-color: #fff;
            border: 1px solid #e0e6ed;
            padding: 16px 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .filter-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-item label {
            font-size: 14px;
            color: #606266;
        }
        .filter-item select,
        .filter-item input {
            padding: 6px 12px;
            border: 1px solid #dcdfe6;
            font-size: 14px;
            color: #606266;
            background-color: #fff;
            outline: none;
        }
        .filter-item select:focus,
        .filter-item input:focus {
            border-color: #1e88e5;
        }
        .btn-primary {
            background-color: #1e88e5;
            color: #fff;
            border: none;
            padding: 8px 20px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-primary:hover {
            background-color: #1976d2;
        }
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 24px;
            margin-bottom: 24px;
        }
        .card {
            background-color: #fff;
            border: 1px solid #e0e6ed;
            padding: 20px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #303133;
        }
        .card-subtitle {
            font-size: 12px;
            color: #909399;
            margin-top: 4px;
        }
        .setting-form {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #303133;
        }
        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #dcdfe6;
            font-size: 14px;
            color: #606266;
            background-color: #fff;
            outline: none;
            border-radius: 2px;
        }
        .form-control:focus {
            border-color: #1e88e5;
        }
        .form-row {
            display: flex;
            gap: 16px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        @media (max-width: 1200px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 768px) {
            .navbar-menu {
                display: none;
            }
            .filter-section {
                flex-direction: column;
                align-items: stretch;
            }
            .form-row {
                flex-direction: column;
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <i class="fas fa-chart-line"></i>
            日志分析系统
        </div>
        <ul class="navbar-menu">
            <li>
                <a href="index.html">
                    <i class="fas fa-home"></i>
                    首页
                </a>
            </li>
            <li>
                <a href="log-management.html">
                    <i class="fas fa-file-alt"></i>
                    日志管理
                    <i class="fas fa-chevron-down" style="font-size: 12px;"></i>
                </a>
                <div class="dropdown">
                    <a href="data-import.html"><i class="fas fa-upload"></i> 数据导入</a>
                    <a href="query-analysis.html"><i class="fas fa-search"></i> 查询分析</a>
                </div>
            </li>
            <li>
                <a href="monitoring.html">
                    <i class="fas fa-desktop"></i>
                    监控中心
                </a>
            </li>
            <li>
                <a href="visualization.html">
                    <i class="fas fa-chart-bar"></i>
                    可视化配置
                </a>
            </li>
            <li>
                <a href="security.html">
                    <i class="fas fa-shield-alt"></i>
                    安全管理
                    <i class="fas fa-chevron-down" style="font-size: 12px;"></i>
                </a>
                <div class="dropdown">
                    <a href="permission.html"><i class="fas fa-users-cog"></i> 权限管理</a>
                    <a href="exception-report.html"><i class="fas fa-exclamation-triangle"></i> 异常报告</a>
                </div>
            </li>
            <li>
                <a href="system-settings.html" class="active">
                    <i class="fas fa-cog"></i>
                    系统设置
                </a>
            </li>
        </ul>
        <div class="user-menu">
            <div class="user-dropdown">
                <div class="user-dropdown-toggle">
                    <i class="fas fa-user-circle"></i>
                    <span>管理员</span>
                    <i class="fas fa-chevron-down" style="font-size: 12px;"></i>
                </div>
                <div class="user-dropdown-menu">
                    <a href="#"><i class="fas fa-user"></i> 个人资料</a>
                    <a href="#"><i class="fas fa-sign-out-alt"></i> 退出登录</a>
                </div>
            </div>
        </div>
    </nav>
    <div class="main-container">
        <div class="card" style="margin-bottom: 24px;">
            <div class="card-header">
                <div>
                    <div class="card-title">系统设置</div>
                    <div class="card-subtitle">集中管理系统参数配置</div>
                </div>
            </div>
            <p style="color: #606266; line-height: 1.6;">
                集中管理系统参数配置，如数据源连接设置、缓存策略调整、API集成配置等。支持个性化系统偏好设置和部署环境管理，涵盖Redis、Elasticsearch等外部服务配置。
            </p>
        </div>
        <div class="card">
            <div class="card-header">
                <div class="card-title">配置设置</div>
            </div>
            <div class="setting-form">
                <div class="form-group">
                    <label><i class="fas fa-database"></i> 数据源连接设置</label>
                    <div class="form-row">
                        <div class="form-group">
                            <label>数据库类型</label>
                            <select class="form-control">
                                <option>MySQL</option>
                                <option>PostgreSQL</option>
                                <option>MongoDB</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>主机地址</label>
                            <input type="text" class="form-control" placeholder="例如: localhost:3306">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>用户名</label>
                            <input type="text" class="form-control" placeholder="数据库用户名">
                        </div>
                        <div class="form-group">
                            <label>密码</label>
                            <input type="password" class="form-control" placeholder="数据库密码">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-hdd"></i> 缓存策略调整</label>
                    <div class="form-row">
                        <div class="form-group">
                            <label>缓存类型</label>
                            <select class="form-control">
                                <option>Redis</option>
                                <option>Memcached</option>
                                <option>本地缓存</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>缓存大小</label>
                            <input type="text" class="form-control" placeholder="例如: 1GB">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>过期时间</label>
                            <input type="text" class="form-control" placeholder="例如: 3600秒">
                        </div>
                        <div class="form-group">
                            <label>刷新策略</label>
                            <select class="form-control">
                                <option>定时刷新</option>
                                <option>事件驱动</option>
                                <option>手动刷新</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-plug"></i> API集成配置</label>
                    <div class="form-row">
                        <div class="form-group">
                            <label>API密钥</label>
                            <input type="password" class="form-control" placeholder="API访问密钥">
                        </div>
                        <div class="form-group">
                            <label>API端点</label>
                            <input type="text" class="form-control" placeholder="例如: https://api.example.com">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>超时时间</label>
                            <input type="text" class="form-control" placeholder="例如: 30秒">
                        </div>
                        <div class="form-group">
                            <label>重试次数</label>
                            <input type="number" class="form-control" placeholder="例如: 3">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-server"></i> 外部服务配置</label>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Redis地址</label>
                            <input type="text" class="form-control" placeholder="例如: redis://localhost:6379">
                        </div>
                        <div class="form-group">
                            <label>Elasticsearch地址</label>
                            <input type="text" class="form-control" placeholder="例如: http://localhost:9200">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>服务认证</label>
                            <input type="text" class="form-control" placeholder="认证信息">
                        </div>
                        <div class="form-group">
                            <label>健康检查</label>
                            <select class="form-control">
                                <option>启用</option>
                                <option>禁用</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-sliders-h"></i> 系统偏好设置</label>
                    <div class="form-row">
                        <div class="form-group">
                            <label>默认时间范围</label>
                            <select class="form-control">
                                <option>最近24小时</option>
                                <option>最近7天</option>
                                <option>最近30天</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>主题颜色</label>
                            <select class="form-control">
                                <option>默认蓝色</option>
                                <option>深色模式</option>
                                <option>绿色主题</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>通知方式</label>
                            <select class="form-control">
                                <option>邮件通知</option>
                                <option>短信通知</option>
                                <option>系统弹窗</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>日志级别</label>
                            <select class="form-control">
                                <option>INFO</option>
                                <option>WARN</option>
                                <option>ERROR</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="btn-group">
                    <button class="btn-primary">
                        <i class="fas fa-save"></i> 保存设置
                    </button>
                    <button class="btn-primary" style="background-color: #606266;">
                        <i class="fas fa-sync-alt"></i> 重置设置
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const navLinks = document.querySelectorAll('.navbar-menu a');
            navLinks.forEach(link => {
                if (link.getAttribute('href') === 'system-settings.html') {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
