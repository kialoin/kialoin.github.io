<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>问卷发布与分享 - 智能问卷平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.5;
        }
        .navbar {
            background-color: #fff;
            border-bottom: 1px solid #e1e4e8;
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        .nav-brand {
            font-size: 20px;
            font-weight: 600;
            color: #2563eb;
            text-decoration: none;
        }
        .nav-menu {
            display: flex;
            margin-left: 48px;
            list-style: none;
        }
        .nav-item {
            margin-right: 32px;
        }
        .nav-link {
            color: #666;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }
        .nav-link:hover,
        .nav-link.active {
            color: #2563eb;
        }
        .nav-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            background-color: #e1e4e8;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
        }
        .main-container {
            margin-top: 60px;
            padding: 24px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }
        .page-header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .page-subtitle {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }
        .card {
            background-color: #fff;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 24px;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .card-icon {
            width: 36px;
            height: 36px;
            background-color: #eff6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2563eb;
            font-size: 18px;
            border-radius: 6px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-input:focus {
            outline: none;
            border-color: #2563eb;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background-color: #2563eb;
            color: #fff;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }
        .btn-outline {
            background-color: transparent;
            border: 1px solid #d1d5db;
            color: #374151;
        }
        .btn-outline:hover {
            background-color: #f3f4f6;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background-color: #fff;
            border: 1px solid #e1e4e8;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            background-color: #eff6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2563eb;
            font-size: 24px;
        }
        .stat-content {
            flex: 1;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 600;
            color: #1a1a1a;
            line-height: 1;
        }
        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }
        .stat-change {
            font-size: 12px;
            margin-top: 4px;
        }
        .stat-change.positive {
            color: #10b981;
        }
        .stat-change.negative {
            color: #ef4444;
        }
        .chart-card {
            background-color: #fff;
            border: 1px solid #e1e4e8;
            padding: 20px;
            margin-bottom: 24px;
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .chart-actions {
            display: flex;
            gap: 8px;
        }
        .chart-action-btn {
            padding: 4px 8px;
            border: 1px solid #d1d5db;
            background-color: #fff;
            color: #666;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .chart-action-btn:hover {
            background-color: #f3f4f6;
            border-color: #9ca3af;
        }
        .chart-container {
            width: 100%;
            height: 300px;
        }
        .action-bar {
            background-color: #fff;
            border: 1px solid #e1e4e8;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
        }
        .action-btn {
            padding: 8px 16px;
            border: 1px solid #d1d5db;
            background-color: #fff;
            color: #374151;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
        }
        .action-btn:hover {
            background-color: #f3f4f6;
            border-color: #9ca3af;
        }
        .action-btn.primary {
            background-color: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }
        .action-btn.primary:hover {
            background-color: #1d4ed8;
            border-color: #1d4ed8;
        }
        .last-update {
            font-size: 12px;
            color: #9ca3af;
        }
        @media (max-width: 768px) {
            .nav-menu {
                display: none;
            }
            .card-grid {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .action-bar {
                flex-direction: column;
                gap: 12px;
                align-items: stretch;
            }
            .action-buttons {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="#" class="nav-brand">
            <i class="fas fa-poll"></i> 智能问卷平台
        </a>
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="#" class="nav-link">问卷列表</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link active">问卷发布与分享</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">数据监控</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">智能报告</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link">帮助</a>
            </li>
        </ul>
        <div class="nav-right">
            <i class="fas fa-bell" style="color: #666; font-size: 16px; cursor: pointer;"></i>
            <div class="user-avatar">张</div>
        </div>
    </nav>
    <div class="main-container">
        <div class="page-header">
            <div>
                <h1 class="page-title">问卷发布与分享</h1>
                <p class="page-subtitle">问卷名称：2024年度客户满意度调查 | 发布时间：2024-01-31 18:30:00</p>
            </div>
        </div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-eye"></i>
                </div>
                <div class="stat-content">
                    <div class="stat-value">1,234</div>
                    <div class="stat-label">访问次数</div>
                    <div class="stat-change positive">
                        <i class="fas fa-arrow-up"></i> 12.5% 较昨日
                    </div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-content">
                    <div class="stat-value">87.3%</div>
                    <div class="stat-label">完成率</div>
                    <div class="stat-change positive">
                        <i class="fas fa-arrow-up"></i> 3.2% 较昨日
                    </div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-content">
                    <div class="stat-value">1,076</div>
                    <div class="stat-label">有效提交</div>
                    <div class="stat-change positive">
                        <i class="fas fa-arrow-up"></i> 8.1% 较昨日
                    </div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="stat-content">
                    <div class="stat-value">4.2</div>
                    <div class="stat-label">平均完成时间(分钟)</div>
                    <div class="stat-change negative">
                        <i class="fas fa-arrow-down"></i> 8.1% 较昨日
                    </div>
                </div>
            </div>
        </div>
        <div class="card-grid">
            <div class="card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-link"></i>
                    </div>
                    <h3 class="card-title">分享链接</h3>
                </div>
                <div class="form-group">
                    <label class="form-label">问卷访问链接</label>
                    <input type="text" class="form-input" value="https://survey.example.com/abc123def456" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">短链接</label>
                    <input type="text" class="form-input" value="https://surl.com/abc123" readonly>
                </div>
                <button class="btn btn-primary">
                    <i class="fas fa-copy"></i> 复制链接
                </button>
            </div>
            <div class="card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-qrcode"></i>
                    </div>
                    <h3 class="card-title">二维码下载</h3>
                </div>
                <div style="text-align: center; margin-bottom: 16px;">
                    <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2RkZCIvPjxjaXJjbGUgY3g9IjUwIiBjeT0iNTAiIHI9IjIwIiBmaWxsPSIjZmZmIi8+PC9zdmc+" alt="二维码示例" style="width: 100px; height: 100px;">
                </div>
                <button class="btn btn-primary">
                    <i class="fas fa-download"></i> 下载二维码
                </button>
            </div>
            <div class="card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-code"></i>
                    </div>
                    <h3 class="card-title">嵌入代码</h3>
                </div>
                <div class="form-group">
                    <label class="form-label">HTML嵌入代码</label>
                    <textarea class="form-input" rows="3" readonly>&lt;iframe src="https://survey.example.com/abc123def456" width="600" height="400"&gt;&lt;/iframe&gt;</textarea>
                </div>
                <button class="btn btn-primary">
                    <i class="fas fa-copy"></i> 复制代码
                </button>
            </div>
            <div class="card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-share-alt"></i>
                    </div>
                    <h3 class="card-title">多渠道分享</h3>
                </div>
                <div class="form-group">
                    <label class="form-label">选择分享平台</label>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                        <button class="btn btn-outline">
                            <i class="fab fa-weixin"></i> 微信
                        </button>
                        <button class="btn btn-outline">
                            <i class="fab fa-weibo"></i> 微博
                        </button>
                        <button class="btn btn-outline">
                            <i class="fab fa-facebook"></i> Facebook
                        </button>
                        <button class="btn btn-outline">
                            <i class="fab fa-twitter"></i> Twitter
                        </button>
                        <button class="btn btn-outline">
                            <i class="fab fa-linkedin"></i> LinkedIn
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">邮件发送</label>
                    <button class="btn btn-outline">
                        <i class="fas fa-envelope"></i> 邮件发送集成SMTP
                    </button>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-cog"></i>
                    </div>
                    <h3 class="card-title">问卷设置</h3>
                </div>
                <div class="form-group">
                    <label class="form-label">问卷截止时间</label>
                    <input type="datetime-local" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">访问限制</label>
                    <select class="form-input">
                        <option>无限制</option>
                        <option>每人仅限提交一次</option>
                        <option>按IP地址限制</option>
                        <option>按用户ID限制</option>
                    </select>
                </div>
                <button class="btn btn-primary">
                    <i class="fas fa-save"></i> 保存设置
                </button>
            </div>
            <div class="card">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas fa-chart-line"></i>
                    </div>
                    <h3 class="card-title">实时访问统计</h3>
                </div>
                <div class="form-group">
                    <label class="form-label">今日访问次数</label>
                    <div style="font-size: 24px; font-weight: bold; color: #2563eb;">124</div>
                </div>
                <div class="form-group">
                    <label class="form-label">今日有效提交</label>
                    <div style="font-size: 24px; font-weight: bold; color: #10b981;">98</div>
                </div>
                <div class="form-group">
                    <label class="form-label">访问率</label>
                    <div style="font-size: 24px; font-weight: bold; color: #f59e0b;">79%</div>
                </div>
            </div>
        </div>
        <div class="chart-card">
            <div class="chart-header">
                <h3 class="chart-title">访问趋势分析</h3>
                <div class="chart-actions">
                    <button class="chart-action-btn">
                        <i class="fas fa-download"></i> 导出
                    </button>
                    <button class="chart-action-btn">
                        <i class="fas fa-expand"></i>
                    </button>
                </div>
            </div>
            <div id="trendChart" class="chart-container"></div>
        </div>
        <div class="action-bar">
            <div class="action-buttons">
                <button class="action-btn">
                    <i class="fas fa-share-alt"></i> 分享问卷
                </button>
                <button class="action-btn">
                    <i class="fas fa-print"></i> 打印问卷
                </button>
                <button class="action-btn">
                    <i class="fas fa-download"></i> 导出数据
                </button>
                <button class="action-btn primary">
                    <i class="fas fa-sync-alt"></i> 刷新统计
                </button>
            </div>
            <div class="last-update">
                <i class="fas fa-clock"></i> 最后更新：2024-01-31 18:30:00
            </div>
        </div>
    </div>
    <script>
        const trendChart = echarts.init(document.getElementById('trendChart'));
        const trendOption = {
            tooltip: {
                trigger: 'axis'
            },
            legend: {
                data: ['访问次数', '有效提交'],
                textStyle: {
                    fontSize: 12
                }
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                data: ['00:00', '04:00', '08:00', '12:00', '16:00', '20:00', '24:00'],
                axisLabel: {
                    fontSize: 12
                }
            },
            yAxis: {
                type: 'value',
                axisLabel: {
                    fontSize: 12
                }
            },
            series: [
                {
                    name: '访问次数',
                    type: 'line',
                    smooth: true,
                    data: [20, 35, 80, 150, 120, 90, 45],
                    itemStyle: {
                        color: '#2563eb'
                    },
                    areaStyle: {
                        color: {
                            type: 'linear',
                            x: 0,
                            y: 0,
                            x2: 0,
                            y2: 1,
                            colorStops: [{
                                offset: 0, color: 'rgba(37, 99, 235, 0.3)'
                            }, {
                                offset: 1, color: 'rgba(37, 99, 235, 0.05)'
                            }]
                        }
                    }
                },
                {
                    name: '有效提交',
                    type: 'line',
                    smooth: true,
                    data: [5, 12, 30, 65, 50, 35, 20],
                    itemStyle: {
                        color: '#10b981'
                    }
                }
            ]
        };
        trendChart.setOption(trendOption);
        window.addEventListener('resize', function() {
            trendChart.resize();
        });
    </script>
</body>
</html>
