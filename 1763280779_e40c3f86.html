<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据挖掘可视化平台 - 系统监控</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f7fa;
            color: #2c3e50;
            font-size: 14px;
            line-height: 1.5;
        }
        .navbar {
            background-color: #fff;
            border-bottom: 1px solid #e1e8ed;
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 600;
            color: #1a73e8;
            margin-right: auto;
        }
        .navbar-menu {
            display: flex;
            gap: 8px;
            list-style: none;
        }
        .navbar-item {
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #5f6368;
            font-size: 14px;
        }
        .navbar-item:hover {
            background-color: #f8f9fa;
            color: #1a73e8;
        }
        .navbar-item.active {
            background-color: #e8f0fe;
            color: #1a73e8;
        }
        .sidebar {
            position: fixed;
            left: 0;
            top: 60px;
            bottom: 0;
            width: 240px;
            background-color: #fff;
            border-right: 1px solid #e1e8ed;
            padding: 16px;
            overflow-y: auto;
        }
        .sidebar-section {
            margin-bottom: 24px;
        }
        .sidebar-title {
            font-size: 12px;
            color: #5f6368;
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .sidebar-item {
            padding: 10px 12px;
            margin-bottom: 4px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #5f6368;
            font-size: 14px;
            transition: all 0.2s;
        }
        .sidebar-item:hover {
            background-color: #f8f9fa;
            color: #1a73e8;
        }
        .sidebar-item.active {
            background-color: #e8f0fe;
            color: #1a73e8;
        }
        .main-content {
            margin-left: 240px;
            margin-top: 60px;
            padding: 24px;
        }
        .filter-bar {
            background-color: #fff;
            border: 1px solid #e1e8ed;
            padding: 16px 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-label {
            font-size: 14px;
            color: #5f6368;
        }
        .filter-select, .filter-input {
            padding: 8px 12px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 14px;
            background-color: #fff;
            color: #2c3e50;
            outline: none;
            transition: border-color 0.2s;
        }
        .filter-select:focus, .filter-input:focus {
            border-color: #1a73e8;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background-color: #1a73e8;
            color: white;
        }
        .btn-primary:hover {
            background-color: #1557b0;
        }
        .btn-secondary {
            background-color: #f8f9fa;
            color: #5f6368;
            border: 1px solid #dadce0;
        }
        .btn-secondary:hover {
            background-color: #e8eaed;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }
        .chart-card {
            background-color: #fff;
            border: 1px solid #e1e8ed;
            padding: 20px;
            position: relative;
        }
        .chart-card.full-width {
            grid-column: 1 / -1;
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #2c3e50;
        }
        .chart-actions {
            display: flex;
            gap: 8px;
        }
        .chart-action {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 4px;
            color: #5f6368;
            transition: all 0.2s;
        }
        .chart-action:hover {
            background-color: #f8f9fa;
            color: #1a73e8;
        }
        .chart-container {
            width: 100%;
            height: 300px;
        }
        .chart-container.large {
            height: 400px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background-color: #fff;
            border: 1px solid #e1e8ed;
            padding: 20px;
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 24px;
        }
        .stat-icon.blue {
            background-color: #e8f0fe;
            color: #1a73e8;
        }
        .stat-icon.green {
            background-color: #e6f4ea;
            color: #188038;
        }
        .stat-icon.orange {
            background-color: #fef7e0;
            color: #ea8600;
        }
        .stat-icon.red {
            background-color: #fce8e6;
            color: #d93025;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 14px;
            color: #5f6368;
        }
        .stat-change {
            font-size: 12px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stat-change.positive {
            color: #188038;
        }
        .stat-change.negative {
            color: #d93025;
        }
        .loading {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
        }
        .loading.active {
            display: block;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a73e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
            }
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .navbar-menu {
                display: none;
            }
            .menu-toggle {
                display: block;
            }
        }
        .menu-toggle {
            display: none;
            cursor: pointer;
            padding: 8px;
        }
        .export-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background-color: #fff;
            border: 1px solid #e1e8ed;
            border-radius: 4px;
            padding: 8px;
            display: none;
            z-index: 100;
            min-width: 150px;
        }
        .export-menu.active {
            display: block;
        }
        .export-option {
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #5f6368;
        }
        .export-option:hover {
            background-color: #f8f9fa;
            color: #1a73e8;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="menu-toggle" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </div>
        <div class="navbar-brand">
            <i class="fas fa-chart-line"></i>
            <span>数据挖掘可视化平台</span>
        </div>
        <ul class="navbar-menu">
            <li class="navbar-item">
                <i class="fas fa-tachometer-alt"></i>
                <span>仪表板</span>
            </li>
            <li class="navbar-item">
                <i class="fas fa-upload"></i>
                <span>数据导入</span>
            </li>
            <li class="navbar-item">
                <i class="fas fa-cogs"></i>
                <span>分析任务</span>
            </li>
            <li class="navbar-item">
                <i class="fas fa-file-alt"></i>
                <span>报告生成</span>
            </li>
            <li class="navbar-item">
                <i class="fas fa-users"></i>
                <span>用户管理</span>
            </li>
            <li class="navbar-item active">
                <i class="fas fa-desktop"></i>
                <span>系统监控</span>
            </li>
            <li class="navbar-item">
                <i class="fas fa-sign-out-alt"></i>
                <span>退出登录</span>
            </li>
        </ul>
    </nav>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-title">快速访问</div>
            <div class="sidebar-item">
                <i class="fas fa-chart-pie"></i>
                <span>概览分析</span>
            </div>
            <div class="sidebar-item">
                <i class="fas fa-users"></i>
                <span>用户行为</span>
            </div>
            <div class="sidebar-item">
                <i class="fas fa-mouse-pointer"></i>
                <span>点击热力</span>
            </div>
            <div class="sidebar-item">
                <i class="fas fa-route"></i>
                <span>访问路径</span>
            </div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-title">系统监控</div>
            <div class="sidebar-item active">
                <i class="fas fa-server"></i>
                <span>资源监控</span>
            </div>
            <div class="sidebar-item">
                <i class="fas fa-tasks"></i>
                <span>任务队列</span>
            </div>
            <div class="sidebar-item">
                <i class="fas fa-exclamation-triangle"></i>
                <span>异常日志</span>
            </div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-title">设置</div>
            <div class="sidebar-item">
                <i class="fas fa-palette"></i>
                <span>主题设置</span>
            </div>
            <div class="sidebar-item">
                <i class="fas fa-save"></i>
                <span>保存配置</span>
            </div>
        </div>
    </aside>
    <main class="main-content">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon blue">
                    <i class="fas fa-microchip"></i>
                </div>
                <div class="stat-value">68%</div>
                <div class="stat-label">CPU使用率</div>
                <div class="stat-change positive">
                    <i class="fas fa-arrow-up"></i>
                    <span>2.1% 较上分钟</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">
                    <i class="fas fa-memory"></i>
                </div>
                <div class="stat-value">42%</div>
                <div class="stat-label">内存使用率</div>
                <div class="stat-change negative">
                    <i class="fas fa-arrow-down"></i>
                    <span>1.3% 较上分钟</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange">
                    <i class="fas fa-list"></i>
                </div>
                <div class="stat-value">12</div>
                <div class="stat-label">待处理任务</div>
                <div class="stat-change positive">
                    <i class="fas fa-arrow-up"></i>
                    <span>3 个新增</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon red">
                    <i class="fas fa-bug"></i>
                </div>
                <div class="stat-value">2</div>
                <div class="stat-label">异常日志</div>
                <div class="stat-change negative">
                    <i class="fas fa-arrow-down"></i>
                    <span>1 个已解决</span>
                </div>
            </div>
        </div>
        <div class="filter-bar">
            <div class="filter-group">
                <label class="filter-label">监控范围：</label>
                <select class="filter-select">
                    <option>全部节点</option>
                    <option>主服务器</option>
                    <option>计算节点1</option>
                    <option>计算节点2</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">时间范围：</label>
                <select class="filter-select">
                    <option>最近1小时</option>
                    <option>最近6小时</option>
                    <option>最近24小时</option>
                    <option>自定义</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">告警级别：</label>
                <select class="filter-select">
                    <option>全部</option>
                    <option>警告</option>
                    <option>严重</option>
                    <option>紧急</option>
                </select>
            </div>
            <button class="btn btn-primary">
                <i class="fas fa-sync-alt"></i>
                <span>刷新数据</span>
            </button>
            <button class="btn btn-secondary">
                <i class="fas fa-cog"></i>
                <span>配置告警</span>
            </button>
        </div>
        <div class="dashboard-grid">
            <div class="chart-card full-width">
                <div class="chart-header">
                    <h3 class="chart-title">CPU使用率趋势</h3>
                    <div class="chart-actions">
                        <div class="chart-action" onclick="toggleExportMenu(this)">
                            <i class="fas fa-download"></i>
                        </div>
                        <div class="export-menu">
                            <div class="export-option">
                                <i class="fas fa-file-image"></i>
                                <span>导出为PNG</span>
                            </div>
                            <div class="export-option">
                                <i class="fas fa-file-csv"></i>
                                <span>导出为CSV</span>
                            </div>
                            <div class="export-option">
                                <i class="fas fa-file-code"></i>
                                <span>导出为JSON</span>
                            </div>
                        </div>
                        <div class="chart-action">
                            <i class="fas fa-expand"></i>
                        </div>
                    </div>
                </div>
                <div id="cpuChart" class="chart-container large"></div>
            </div>
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">内存使用分布</h3>
                    <div class="chart-actions">
                        <div class="chart-action">
                            <i class="fas fa-download"></i>
                        </div>
                        <div class="chart-action">
                            <i class="fas fa-expand"></i>
                        </div>
                    </div>
                </div>
                <div id="memoryChart" class="chart-container"></div>
            </div>
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">任务队列状态</h3>
                    <div class="chart-actions">
                        <div class="chart-action">
                            <i class="fas fa-download"></i>
                        </div>
                        <div class="chart-action">
                            <i class="fas fa-expand"></i>
                        </div>
                    </div>
                </div>
                <div id="queueChart" class="chart-container"></div>
            </div>
            <div class="chart-card full-width">
                <div class="chart-header">
                    <h3 class="chart-title">异常日志分布</h3>
                    <div class="chart-actions">
                        <div class="chart-action">
                            <i class="fas fa-download"></i>
                        </div>
                        <div class="chart-action">
                            <i class="fas fa-expand"></i>
                        </div>
                    </div>
                </div>
                <div id="logChart" class="chart-container"></div>
            </div>
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">告警级别统计</h3>
                    <div class="chart-actions">
                        <div class="chart-action">
                            <i class="fas fa-download"></i>
                        </div>
                        <div class="chart-action">
                            <i class="fas fa-expand"></i>
                        </div>
                    </div>
                </div>
                <div id="alertChart" class="chart-container"></div>
            </div>
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">系统负载监控</h3>
                    <div class="chart-actions">
                        <div class="chart-action">
                            <i class="fas fa-download"></i>
                        </div>
                        <div class="chart-action">
                            <i class="fas fa-expand"></i>
                        </div>
                    </div>
                </div>
                <div id="loadChart" class="chart-container"></div>
            </div>
        </div>
    </main>
    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initCpuChart();
            initMemoryChart();
            initQueueChart();
            initLogChart();
            initAlertChart();
            initLoadChart();
        });
        function initCpuChart() {
            const chart = echarts.init(document.getElementById('cpuChart'));
            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross'
                    }
                },
                legend: {
                    data: ['CPU使用率', 'CPU负载']
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: ['00:00', '01:00', '02:00', '03:00', '04:00', '05:00', '06:00', '07:00', '08:00', '09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00', '20:00', '21:00', '22:00', '23:00']
                },
                yAxis: {
                    type: 'value',
                    axisLabel: {
                        formatter: '{value} %'
                    }
                },
                series: [
                    {
                        name: 'CPU使用率',
                        type: 'line',
                        smooth: true,
                        data: [45, 48, 52, 60, 68, 65, 62, 58, 55, 52, 48, 45, 42, 40, 45, 50, 55, 60, 65, 68, 65, 60, 55, 50],
                        itemStyle: {
                            color: '#1a73e8'
                        }
                    },
                    {
                        name: 'CPU负载',
                        type: 'line',
                        smooth: true,
                        data: [1.2, 1.3, 1.5, 1.8, 2.1, 2.0, 1.9, 1.7, 1.6, 1.5, 1.4, 1.3, 1.2, 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.6, 1.5, 1.4, 1.3],
                        itemStyle: {
                            color: '#188038'
                        }
                    }
                ]
            };
            chart.setOption(option);
            window.addEventListener('resize', () => chart.resize());
        }
        function initMemoryChart() {
            const chart = echarts.init(document.getElementById('memoryChart'));
            const option = {
                tooltip: {
                    trigger: 'item',
                    formatter: '{a} <br/>{b}: {c} ({d}%)'
                },
                legend: {
                    orient: 'vertical',
                    left: 'left'
                },
                series: [
                    {
                        name: '内存使用',
                        type: 'pie',
                        radius: ['40%', '70%'],
                        avoidLabelOverlap: false,
                        label: {
                            show: false,
                            position: 'center'
                        },
                        emphasis: {
                            label: {
                                show: true,
                                fontSize: '18',
                                fontWeight: 'bold'
                            }
                        },
                        labelLine: {
                            show: false
                        },
                        data: [
                            {value: 2400, name: '已使用', itemStyle: {color: '#1a73e8'}},
                            {value: 3200, name: '可用', itemStyle: {color: '#188038'}},
                            {value: 400, name: '缓存', itemStyle: {color: '#ea8600'}}
                        ]
                    }
                ]
            };
            chart.setOption(option);
            window.addEventListener('resize', () => chart.resize());
        }
        function initQueueChart() {
            const chart = echarts.init(document.getElementById('queueChart'));
            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: ['待处理', '运行中', '已完成', '失败']
                },
                yAxis: {
                    type: 'value'
                },
                series: [
                    {
                        name: '任务数量',
                        type: 'bar',
                        data: [12, 8, 25, 3],
                        itemStyle: {
                            color: '#1a73e8'
                        }
                    }
                ]
            };
            chart.setOption(option);
            window.addEventListener('resize', () => chart.resize());
        }
        function initLogChart() {
            const chart = echarts.init(document.getElementById('logChart'));
            const hours = ['00:00', '01:00', '02:00', '03:00', '04:00', '05:00', '06:00', '07:00', '08:00', '09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00', '20:00', '21:00', '22:00', '23:00'];
            const days = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
            const data = [];
            for (let i = 0; i < days.length; i++) {
                for (let j = 0; j < hours.length; j++) {
                    data.push([j, i, Math.floor(Math.random() * 10)]);
                }
            }
            const option = {

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        }
        function toggleExportMenu(element) {
            const menu = element.nextElementSibling;
            menu.classList.toggle('active');
            document.addEventListener('click', function closeMenu(e) {
                if (!element.contains(e.target) && !menu.contains(e.target)) {
                    menu.classList.remove('active');
                    document.removeEventListener('click', closeMenu);
                }
            });
        }
        function showLoading() {
            document.getElementById('loading').classList.add('active');
        }
        function hideLoading() {
            document.getElementById('loading').classList.remove('active');
        }
        document.querySelectorAll('.navbar-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.navbar-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
            });
        });
        document.querySelectorAll('.sidebar-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
