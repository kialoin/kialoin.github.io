<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>偏好分析建模管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f5f7fa;
            color: #333;
            font-size: 14px;
            line-height: 1.5;
        }
        .navbar {
            background-color: #fff;
            border-bottom: 1px solid #e4e7ed;
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .navbar-brand {
            font-size: 18px;
            font-weight: 600;
            color: #1e3a8a;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar-menu {
            display: flex;
            gap: 30px;
            list-style: none;
        }
        .navbar-menu a {
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 2px;
            transition: all 0.3s;
        }
        .navbar-menu a:hover,
        .navbar-menu a.active {
            color: #1e3a8a;
            background-color: #eff6ff;
        }
        .navbar-user {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            background-color: #1e3a8a;
            color: white;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .main-container {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .time-filter {
            background-color: #fff;
            padding: 15px 20px;
            border: 1px solid #e4e7ed;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .time-filter select,
        .time-filter button {
            padding: 6px 12px;
            border: 1px solid #d1d5db;
            background-color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .time-filter button {
            background-color: #1e3a8a;
            color: white;
            border-color: #1e3a8a;
        }
        .model-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .model-card {
            background-color: #fff;
            border: 1px solid #e4e7ed;
            padding: 20px;
            border-radius: 8px;
        }
        .model-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .model-title {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
        }
        .model-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .status-running {
            background-color: #dcfce7;
            color: #166534;
        }
        .status-ready {
            background-color: #dbeafe;
            color: #1e40af;
        }
        .status-error {
            background-color: #fee2e2;
            color: #b91c1c;
        }
        .model-details {
            margin-bottom: 15px;
        }
        .model-detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .model-detail-label {
            color: #64748b;
        }
        .model-detail-value {
            font-weight: 500;
            color: #1e293b;
        }
        .model-actions {
            display: flex;
            gap: 10px;
        }
        .model-action-btn {
            padding: 6px 12px;
            font-size: 12px;
            border: 1px solid #d1d5db;
            background-color: #fff;
            cursor: pointer;
            color: #64748b;
            border-radius: 4px;
        }
        .model-action-btn:hover {
            color: #1e3a8a;
            border-color: #1e3a8a;
        }
        .model-action-btn.primary {
            background-color: #1e3a8a;
            color: white;
            border-color: #1e3a8a;
        }
        .model-action-btn.primary:hover {
            background-color: #1e3a8a;
        }
        .param-config {
            background-color: #fff;
            border: 1px solid #e4e7ed;
            padding: 20px;
            margin-bottom: 30px;
        }
        .param-header {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 15px;
        }
        .param-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .param-item {
            display: flex;
            flex-direction: column;
        }
        .param-label {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 5px;
        }
        .param-input {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 14px;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .chart-card {
            background-color: #fff;
            border: 1px solid #e4e7ed;
            padding: 20px;
        }
        .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
        }
        .chart-actions {
            display: flex;
            gap: 10px;
        }
        .chart-action-btn {
            padding: 5px 10px;
            font-size: 12px;
            border: 1px solid #d1d5db;
            background-color: #fff;
            cursor: pointer;
            color: #64748b;
        }
        .chart-action-btn:hover {
            color: #1e3a8a;
            border-color: #1e3a8a;
        }
        .chart-container {
            height: 300px;
        }
        @media (max-width: 768px) {
            .navbar-menu {
                display: none;
            }
            .charts-grid {
                grid-template-columns: 1fr;
            }
            .model-grid {
                grid-template-columns: 1fr;
            }
            .param-grid {
                grid-template-columns: 1fr;
            }
            .main-container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <i class="fas fa-chart-line"></i>
            数据分析平台
        </div>
        <ul class="navbar-menu">
            <li><a href="#" class="active">仪表盘</a></li>
            <li><a href="#">数据分析</a></li>
            <li><a href="#">报告生成</a></li>
            <li><a href="#">系统管理</a></li>
        </ul>
        <div class="navbar-user">
            <i class="fas fa-bell" style="color: #64748b; cursor: pointer;"></i>
            <div class="user-avatar">A</div>
        </div>
    </nav>
    <div class="main-container">
        <div class="time-filter">
            <label style="font-size: 14px;">时间范围：</label>
            <select id="timeRange">
                <option value="today">今日</option>
                <option value="7days" selected>近7天</option>
                <option value="30days">近30天</option>
                <option value="custom">自定义</option>
            </select>
            <button onclick="refreshData()">
                <i class="fas fa-sync-alt"></i> 刷新数据
            </button>
        </div>
        <div class="model-grid">
            <div class="model-card">
                <div class="model-header">
                    <div class="model-title">协同过滤模型</div>
                    <div class="model-status status-running">运行中</div>
                </div>
                <div class="model-details">
                    <div class="model-detail-item">
                        <span class="model-detail-label">训练进度:</span>
                        <span class="model-detail-value">75%</span>
                    </div>
                    <div class="model-detail-item">
                        <span class="model-detail-label">最后更新:</span>
                        <span class="model-detail-value">2023-10-15 14:30</span>
                    </div>
                    <div class="model-detail-item">
                        <span class="model-detail-label">准确率:</span>
                        <span class="model-detail-value">89.2%</span>
                    </div>
                    <div class="model-detail-item">
                        <span class="model-detail-label">召回率:</span>
                        <span class="model-detail-value">76.8%</span>
                    </div>
                </div>
                <div class="model-actions">
                    <button class="model-action-btn primary" onclick="triggerModel('collaborative')">重新训练</button>
                    <button class="model-action-btn" onclick="viewDetails('collaborative')">查看详情</button>
                </div>
            </div>
            <div class="model-card">
                <div class="model-header">
                    <div class="model-title">深度学习推荐模型</div>
                    <div class="model-status status-ready">就绪</div>
                </div>
                <div class="model-details">
                    <div class="model-detail-item">
                        <span class="model-detail-label">训练进度:</span>
                        <span class="model-detail-value">100%</span>
                    </div>
                    <div class="model-detail-item">
                        <span class="model-detail-label">最后更新:</span>
                        <span class="model-detail-value">2023-10-14 09:15</span>
                    </div>
                    <div class="model-detail-item">
                        <span class="model-detail-label">准确率:</span>
                        <span class="model-detail-value">92.5%</span>
                    </div>
                    <div class="model-detail-item">
                        <span class="model-detail-label">召回率:</span>
                        <span class="model-detail-value">84.3%</span>
                    </div>
                </div>
                <div class="model-actions">
                    <button class="model-action-btn primary" onclick="triggerModel('deep')">重新训练</button>
                    <button class="model-action-btn" onclick="viewDetails('deep')">查看详情</button>
                </div>
            </div>
            <div class="model-card">
                <div class="model-header">
                    <div class="model-title">内容推荐模型</div>
                    <div class="model-status status-error">错误</div>
                </div>
                <div class="model-details">
                    <div class="model-detail-item">
                        <span class="model-detail-label">训练进度:</span>
                        <span class="model-detail-value">45%</span>
                    </div>
                    <div class="model-detail-item">
                        <span class="model-detail-label">最后更新:</span>
                        <span class="model-detail-value">2023-10-13 16:45</span>
                    </div>
                    <div class="model-detail-item">
                        <span class="model-detail-label">准确率:</span>
                        <span class="model-detail-value">-</span>
                    </div>
                    <div class="model-detail-item">
                        <span class="model-detail-label">召回率:</span>
                        <span class="model-detail-value">-</span>
                    </div>
                </div>
                <div class="model-actions">
                    <button class="model-action-btn primary" onclick="triggerModel('content')">重新训练</button>
                    <button class="model-action-btn" onclick="viewDetails('content')">查看详情</button>
                </div>
            </div>
        </div>
        <div class="param-config">
            <div class="param-header">算法参数配置</div>
            <div class="param-grid">
                <div class="param-item">
                    <label class="param-label">协同过滤权重</label>
                    <input type="number" class="param-input" value="0.6" min="0" max="1" step="0.1">
                </div>
                <div class="param-item">
                    <label class="param-label">深度学习权重</label>
                    <input type="number" class="param-input" value="0.3" min="0" max="1" step="0.1">
                </div>
                <div class="param-item">
                    <label class="param-label">内容推荐权重</label>
                    <input type="number" class="param-input" value="0.1" min="0" max="1" step="0.1">
                </div>
                <div class="param-item">
                    <label class="param-label">训练批次大小</label>
                    <input type="number" class="param-input" value="128" min="1">
                </div>
            </div>
            <div style="margin-top: 15px;">
                <button class="model-action-btn primary" onclick="saveParams()">保存配置</button>
            </div>
        </div>
        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">用户画像评分分布</h3>
                    <div class="chart-actions">
                        <button class="chart-action-btn" onclick="exportChart('profile')">
                            <i class="fas fa-download"></i> 导出
                        </button>
                    </div>
                </div>
                <div id="profileChart" class="chart-container"></div>
            </div>
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">趋势预测准确性指标</h3>
                    <div class="chart-actions">
                        <button class="chart-action-btn" onclick="exportChart('accuracy')">
                            <i class="fas fa-download"></i> 导出
                        </button>
                    </div>
                </div>
                <div id="accuracyChart" class="chart-container"></div>
            </div>
        </div>
    </div>
    <script>
        const profileChart = echarts.init(document.getElementById('profileChart'));
        const profileOption = {
            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'cross'
                }
            },
            legend: {
                data: ['低分用户', '中分用户', '高分用户']
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                boundaryGap: false,
                data: ['0-20', '21-40', '41-60', '61-80', '81-100']
            },
            yAxis: {
                type: 'value'
            },
            series: [
                {
                    name: '低分用户',
                    type: 'bar',
                    data: [120, 132, 101, 134, 90],
                    itemStyle: {
                        color: '#ef4444'
                    }
                },
                {
                    name: '中分用户',
                    type: 'bar',
                    data: [220, 182, 191, 234, 290],
                    itemStyle: {
                        color: '#f59e0b'
                    }
                },
                {
                    name: '高分用户',
                    type: 'bar',
                    data: [150, 232, 201, 154, 190],
                    itemStyle: {
                        color: '#22c55e'
                    }
                }
            ]
        };
        profileChart.setOption(profileOption);
        const accuracyChart = echarts.init(document.getElementById('accuracyChart'));
        const accuracyOption = {
            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'cross'
                }
            },
            legend: {
                data: ['准确率', '召回率', 'F1分数']
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                boundaryGap: false,
                data: ['周一', '周二', '周三', '周四', '周五', '周六', '周日']
            },
            yAxis: {
                type: 'value',
                max: 100
            },
            series: [
                {
                    name: '准确率',
                    type: 'line',
                    data: [85, 87, 89, 88, 90, 92, 91],
                    smooth: true,
                    itemStyle: {
                        color: '#1e3a8a'
                    }
                },
                {
                    name: '召回率',
                    type: 'line',
                    data: [78, 80, 82, 81, 83, 85, 84],
                    smooth: true,
                    itemStyle: {
                        color: '#3b82f6'
                    }
                },
                {
                    name: 'F1分数',
                    type: 'line',
                    data: [81, 83, 85, 84, 86, 88, 87],
                    smooth: true,
                    itemStyle: {
                        color: '#60a5fa'
                    }
                }
            ]
        };
        accuracyChart.setOption(accuracyOption);
        window.addEventListener('resize', function() {
            profileChart.resize();
            accuracyChart.resize();
        });
        function refreshData() {
            const button = event.target.closest('button');
            const icon = button.querySelector('i');
            icon.style.animation = 'spin 1s linear';
            setTimeout(() => {
                icon.style.animation = '';
                profileChart.setOption(profileOption);
                accuracyChart.setOption(accuracyOption);
            }, 1000);
        }
        function exportChart(chartType) {
            const chart = chartType === 'profile' ? profileChart : accuracyChart;
            const url = chart.getDataURL({
                type: 'png',
                pixelRatio: 2,
                backgroundColor: '#fff'
            });
            const a = document.createElement('a');
            a.href = url;
            a.download = `${chartType}_chart_${Date.now()}.png`;
            a.click();
        }
        function triggerModel(modelType) {
            alert(`开始训练${modelType === 'collaborative' ? '协同过滤模型' : modelType === 'deep' ? '深度学习推荐模型' : '内容推荐模型'}`);
        }
        function viewDetails(modelType) {
            alert(`查看${modelType === 'collaborative' ? '协同过滤模型' : modelType === 'deep' ? '深度学习推荐模型' : '内容推荐模型'}详细信息`);
        }
        function saveParams() {
            alert('参数已保存');
        }
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
