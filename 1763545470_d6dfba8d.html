<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据存储管理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f5f7fa;
            color: #333;
            font-size: 14px;
            line-height: 1.5;
        }
        .navbar {
            background-color: #fff;
            border-bottom: 1px solid #e4e7ed;
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .navbar-brand {
            font-size: 18px;
            font-weight: 600;
            color: #1e3a8a;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar-menu {
            display: flex;
            gap: 30px;
            list-style: none;
        }
        .navbar-menu a {
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 2px;
            transition: all 0.3s;
        }
        .navbar-menu a:hover,
        .navbar-menu a.active {
            color: #1e3a8a;
            background-color: #eff6ff;
        }
        .navbar-user {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            background-color: #1e3a8a;
            color: white;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .main-container {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .time-filter {
            background-color: #fff;
            padding: 15px 20px;
            border: 1px solid #e4e7ed;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .time-filter select,
        .time-filter button {
            padding: 6px 12px;
            border: 1px solid #d1d5db;
            background-color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .time-filter button {
            background-color: #1e3a8a;
            color: white;
            border-color: #1e3a8a;
        }
        .storage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .storage-card {
            background-color: #fff;
            border: 1px solid #e4e7ed;
            padding: 20px;
            border-radius: 8px;
        }
        .storage-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .storage-title {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
        }
        .storage-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #eff6ff;
            color: #1e3a8a;
            border-radius: 8px;
        }
        .storage-details {
            margin-bottom: 15px;
        }
        .storage-detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .storage-detail-label {
            color: #64748b;
        }
        .storage-detail-value {
            font-weight: 500;
            color: #1e293b;
        }
        .storage-progress {
            height: 8px;
            background-color: #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        .storage-progress-bar {
            height: 100%;
            background-color: #1e3a8a;
            border-radius: 4px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .action-btn {
            padding: 8px 16px;
            border: 1px solid #d1d5db;
            background-color: #fff;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .action-btn:hover {
            background-color: #f9fafb;
        }
        .backup-btn {
            background-color: #1e3a8a;
            color: white;
            border-color: #1e3a8a;
        }
        .backup-btn:hover {
            background-color: #1e3a8a;
        }
        @media (max-width: 768px) {
            .navbar-menu {
                display: none;
            }
            .storage-grid {
                grid-template-columns: 1fr;
            }
            .main-container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <i class="fas fa-database"></i>
            数据分析平台
        </div>
        <ul class="navbar-menu">
            <li><a href="#" class="active">仪表盘</a></li>
            <li><a href="#">数据分析</a></li>
            <li><a href="#">报告生成</a></li>
            <li><a href="#">系统管理</a></li>
        </ul>
        <div class="navbar-user">
            <i class="fas fa-bell" style="color: #64748b; cursor: pointer;"></i>
            <div class="user-avatar">A</div>
        </div>
    </nav>
    <div class="main-container">
        <div class="time-filter">
            <label style="font-size: 14px;">时间范围：</label>
            <select id="timeRange">
                <option value="today">今日</option>
                <option value="7days" selected>近7天</option>
                <option value="30days">近30天</option>
                <option value="custom">自定义</option>
            </select>
            <button onclick="refreshData()">
                <i class="fas fa-sync-alt"></i> 刷新数据
            </button>
        </div>
        <div class="storage-grid">
            <div class="storage-card">
                <div class="storage-header">
                    <h3 class="storage-title">数据表容量统计</h3>
                    <div class="storage-icon">
                        <i class="fas fa-table"></i>
                    </div>
                </div>
                <div class="storage-details">
                    <div class="storage-detail-item">
                        <span class="storage-detail-label">用户行为表</span>
                        <span class="storage-detail-value">2.4 GB</span>
                    </div>
                    <div class="storage-detail-item">
                        <span class="storage-detail-label">订单记录表</span>
                        <span class="storage-detail-value">1.8 GB</span>
                    </div>
                    <div class="storage-detail-item">
                        <span class="storage-detail-label">日志表</span>
                        <span class="storage-detail-value">3.2 GB</span>
                    </div>
                    <div class="storage-detail-item">
                        <span class="storage-detail-label">缓存表</span>
                        <span class="storage-detail-value">0.9 GB</span>
                    </div>
                </div>
                <div class="storage-progress">
                    <div class="storage-progress-bar" style="width: 75%;"></div>
                </div>
                <div class="action-buttons">
                    <button class="action-btn">
                        <i class="fas fa-search"></i> 查看详情
                    </button>
                    <button class="action-btn">
                        <i class="fas fa-chart-bar"></i> 生成报表
                    </button>
                </div>
            </div>
            <div class="storage-card">
                <div class="storage-header">
                    <h3 class="storage-title">报告文件存储状态</h3>
                    <div class="storage-icon">
                        <i class="fas fa-file-alt"></i>
                    </div>
                </div>
                <div class="storage-details">
                    <div class="storage-detail-item">
                        <span class="storage-detail-label">已使用空间</span>
                        <span class="storage-detail-value">12.5 GB</span>
                    </div>
                    <div class="storage-detail-item">
                        <span class="storage-detail-label">总容量</span>
                        <span class="storage-detail-value">20 GB</span>
                    </div>
                    <div class="storage-detail-item">
                        <span class="storage-detail-label">剩余空间</span>
                        <span class="storage-detail-value">7.5 GB</span>
                    </div>
                    <div class="storage-detail-item">
                        <span class="storage-detail-label">清理策略</span>
                        <span class="storage-detail-value">自动清理(30天)</span>
                    </div>
                </div>
                <div class="storage-progress">
                    <div class="storage-progress-bar" style="width: 62.5%;"></div>
                </div>
                <div class="action-buttons">
                    <button class="action-btn">
                        <i class="fas fa-cog"></i> 设置清理
                    </button>
                    <button class="action-btn">
                        <i class="fas fa-trash-alt"></i> 手动清理
                    </button>
                </div>
            </div>
            <div class="storage-card">
                <div class="storage-header">
                    <h3 class="storage-title">存储策略配置</h3>
                    <div class="storage-icon">
                        <i class="fas fa-cogs"></i>
                    </div>
                </div>
                <div class="storage-details">
                    <div class="storage-detail-item">
                        <span class="storage-detail-label">备份频率</span>
                        <span class="storage-detail-value">每日自动</span>
                    </div>
                    <div class="storage-detail-item">
                        <span class="storage-detail-label">备份保留期</span>
                        <span class="storage-detail-value">90天</span>
                    </div>
                    <div class="storage-detail-item">
                        <span class="storage-detail-label">压缩策略</span>
                        <span class="storage-detail-value">启用压缩</span>
                    </div>
                    <div class="storage-detail-item">
                        <span class="storage-detail-label">存储位置</span>
                        <span class="storage-detail-value">本地+云同步</span>
                    </div>
                </div>
                <div class="action-buttons">
                    <button class="action-btn backup-btn">
                        <i class="fas fa-save"></i> 手动备份
                    </button>
                    <button class="action-btn">
                        <i class="fas fa-edit"></i> 编辑策略
                    </button>
                </div>
            </div>
        </div>
        <div class="storage-card" style="margin-bottom: 30px;">
            <div class="storage-header">
                <h3 class="storage-title">存储管理操作</h3>
                <div class="storage-icon">
                    <i class="fas fa-tools"></i>
                </div>
            </div>
            <div class="storage-details">
                <div class="storage-detail-item">
                    <span class="storage-detail-label">手动触发数据备份</span>
                    <button class="action-btn backup-btn">
                        <i class="fas fa-play-circle"></i> 立即备份
                    </button>
                </div>
                <div class="storage-detail-item">
                    <span class="storage-detail-label">调整存储策略</span>
                    <button class="action-btn">
                        <i class="fas fa-sliders-h"></i> 配置策略
                    </button>
                </div>
                <div class="storage-detail-item">
                    <span class="storage-detail-label">存储容量优化</span>
                    <button class="action-btn">
                        <i class="fas fa-bolt"></i> 优化空间
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script>
        function refreshData() {
            const button = event.target.closest('button');
            const icon = button.querySelector('i');
            icon.style.animation = 'spin 1s linear';
            setTimeout(() => {
                icon.style.animation = '';
            }, 1000);
        }
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
