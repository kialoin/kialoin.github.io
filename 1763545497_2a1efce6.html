<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置与部署配置</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #f5f7fa;
            color: #333;
            font-size: 14px;
            line-height: 1.5;
        }
        .navbar {
            background-color: #fff;
            border-bottom: 1px solid #e4e7ed;
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .navbar-brand {
            font-size: 18px;
            font-weight: 600;
            color: #1e3a8a;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar-menu {
            display: flex;
            gap: 30px;
            list-style: none;
        }
        .navbar-menu a {
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 2px;
            transition: all 0.3s;
        }
        .navbar-menu a:hover,
        .navbar-menu a.active {
            color: #1e3a8a;
            background-color: #eff6ff;
        }
        .navbar-user {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            background-color: #1e3a8a;
            color: white;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .main-container {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .time-filter {
            background-color: #fff;
            padding: 15px 20px;
            border: 1px solid #e4e7ed;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .time-filter select,
        .time-filter button {
            padding: 6px 12px;
            border: 1px solid #d1d5db;
            background-color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .time-filter button {
            background-color: #1e3a8a;
            color: white;
            border-color: #1e3a8a;
        }
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .setting-card {
            background-color: #fff;
            border: 1px solid #e4e7ed;
            padding: 20px;
            border-radius: 8px;
        }
        .setting-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .setting-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #eff6ff;
            color: #1e3a8a;
            border-radius: 6px;
        }
        .setting-title {
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
        }
        .setting-description {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 15px;
        }
        .setting-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-size: 13px;
            color: #475569;
            font-weight: 500;
        }
        .form-control {
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 14px;
            background-color: #fff;
        }
        .form-control:focus {
            outline: none;
            border-color: #1e3a8a;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background-color: #1e3a8a;
            color: white;
        }
        .btn-primary:hover {
            background-color: #1e3a8a;
        }
        @media (max-width: 768px) {
            .navbar-menu {
                display: none;
            }
            .settings-grid {
                grid-template-columns: 1fr;
            }
            .main-container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <i class="fas fa-chart-line"></i>
            数据分析平台
        </div>
        <ul class="navbar-menu">
            <li><a href="#" >仪表盘</a></li>
            <li><a href="#" >数据分析</a></li>
            <li><a href="#" >报告生成</a></li>
            <li><a href="#" class="active">系统管理</a></li>
        </ul>
        <div class="navbar-user">
            <i class="fas fa-bell" style="color: #64748b; cursor: pointer;"></i>
            <div class="user-avatar">A</div>
        </div>
    </nav>
    <div class="main-container">
        <div style="margin-bottom: 20px;">
            <h2 style="font-size: 20px; font-weight: 600; color: #1e293b;">系统设置与部署配置</h2>
            <p style="color: #64748b; font-size: 14px;">提供系统级参数配置，包括API端点设置、缓存策略（Redis时效调整）、并发限制修改及第三方服务集成（如云存储密钥配置）</p>
        </div>
        <div class="settings-grid">
            <div class="setting-card">
                <div class="setting-header">
                    <div class="setting-icon">
                        <i class="fas fa-link"></i>
                    </div>
                    <h3 class="setting-title">API端点设置</h3>
                </div>
                <p class="setting-description">配置系统对外提供的API接口地址和访问规则</p>
                <div class="setting-form">
                    <div class="form-group">
                        <label for="apiEndpoint">API基础地址</label>
                        <input type="text" id="apiEndpoint" class="form-control" value="https://api.example.com/v1">
                    </div>
                    <div class="form-group">
                        <label for="apiVersion">API版本</label>
                        <input type="text" id="apiVersion" class="form-control" value="v1">
                    </div>
                    <button class="btn btn-primary">保存配置</button>
                </div>
            </div>
            <div class="setting-card">
                <div class="setting-header">
                    <div class="setting-icon">
                        <i class="fas fa-memory"></i>
                    </div>
                    <h3 class="setting-title">缓存策略</h3>
                </div>
                <p class="setting-description">配置Redis缓存时效和其他缓存相关参数</p>
                <div class="setting-form">
                    <div class="form-group">
                        <label for="redisTTL">Redis TTL (秒)</label>
                        <input type="number" id="redisTTL" class="form-control" value="3600">
                    </div>
                    <div class="form-group">
                        <label for="cacheStrategy">缓存策略</label>
                        <select id="cacheStrategy" class="form-control">
                            <option value="lru">LRU (最近最少使用)</option>
                            <option value="lfu">LFU (最不经常使用)</option>
                            <option value="fifo">FIFO (先进先出)</option>
                        </select>
                    </div>
                    <button class="btn btn-primary">保存配置</button>
                </div>
            </div>
            <div class="setting-card">
                <div class="setting-header">
                    <div class="setting-icon">
                        <i class="fas fa-bolt"></i>
                    </div>
                    <h3 class="setting-title">并发限制</h3>
                </div>
                <p class="setting-description">设置系统最大并发请求数和资源限制</p>
                <div class="setting-form">
                    <div class="form-group">
                        <label for="maxConcurrent">最大并发数</label>
                        <input type="number" id="maxConcurrent" class="form-control" value="100">
                    </div>
                    <div class="form-group">
                        <label for="requestTimeout">请求超时时间(毫秒)</label>
                        <input type="number" id="requestTimeout" class="form-control" value="5000">
                    </div>
                    <button class="btn btn-primary">保存配置</button>
                </div>
            </div>
            <div class="setting-card">
                <div class="setting-header">
                    <div class="setting-icon">
                        <i class="fas fa-plug"></i>
                    </div>
                    <h3 class="setting-title">第三方服务集成</h3>
                </div>
                <p class="setting-description">配置云存储、消息队列等第三方服务密钥</p>
                <div class="setting-form">
                    <div class="form-group">
                        <label for="storageKey">云存储密钥</label>
                        <input type="password" id="storageKey" class="form-control" placeholder="请输入云存储密钥">
                    </div>
                    <div class="form-group">
                        <label for="mqUrl">消息队列地址</label>
                        <input type="text" id="mqUrl" class="form-control" value="amqp://localhost:5672">
                    </div>
                    <button class="btn btn-primary">保存配置</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
