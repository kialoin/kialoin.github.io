<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车辆信息登记 - 校园非机动车管理平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            font-size: 14px;
            line-height: 1.5;
            background-color: #f5f7fa;
            color: #333;
        }
        .container {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 240px;
            background-color: #1e3a5f;
            color: white;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            transition: all 0.3s;
        }
        .sidebar-header {
            padding: 20px;
            background-color: #152a42;
            border-bottom: 1px solid #2a4a6f;
        }
        .sidebar-header h2 {
            font-size: 18px;
            font-weight: 600;
        }
        .nav-menu {
            list-style: none;
            padding: 10px 0;
        }
        .nav-item {
            display: block;
            padding: 12px 20px;
            color: #b8c5d6;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            border-left: 3px solid transparent;
        }
        .nav-item:hover {
            background-color: #234770;
            color: white;
            border-left-color: #4a90e2;
        }
        .nav-item.active {
            background-color: #234770;
            color: white;
            border-left-color: #4a90e2;
        }
        .nav-item i {
            width: 20px;
            margin-right: 10px;
            font-size: 16px;
        }
        .main-content {
            flex: 1;
            margin-left: 240px;
            padding: 20px;
        }
        .user-header {
            background-color: white;
            padding: 20px;
            border: 1px solid #e1e8ed;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .user-info {
            display: flex;
            align-items: center;
        }
        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 4px;
            background-color: #4a90e2;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
            font-size: 24px;
            color: white;
        }
        .user-details h3 {
            font-size: 18px;
            margin-bottom: 5px;
        }
        .user-details p {
            color: #666;
            font-size: 14px;
        }
        .user-actions button {
            padding: 8px 16px;
            margin-left: 10px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .user-actions button:hover {
            background-color: #3a7bc8;
        }
        .card {
            background-color: white;
            border: 1px solid #e1e8ed;
            margin-bottom: 20px;
        }
        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e1e8ed;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #1e3a5f;
        }
        .card-body {
            padding: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #1e3a5f;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: #4a90e2;
        }
        .form-row {
            display: flex;
            gap: 20px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 4px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background-color: #fafafa;
        }
        .upload-area:hover {
            border-color: #4a90e2;
            background-color: #f0f8ff;
        }
        .upload-area i {
            font-size: 48px;
            color: #4a90e2;
            margin-bottom: 10px;
        }
        .upload-area p {
            color: #666;
            margin-bottom: 10px;
        }
        .upload-preview {
            margin-top: 15px;
            text-align: center;
        }
        .upload-preview img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 4px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-primary {
            background-color: #4a90e2;
            color: white;
        }
        .btn-primary:hover {
            background-color: #3a7bc8;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        .btn-outline {
            background-color: transparent;
            color: #4a90e2;
            border: 1px solid #4a90e2;
        }
        .btn-outline:hover {
            background-color: #4a90e2;
            color: white;
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
            }
            .sidebar-header h2,
            .nav-item span {
                display: none;
            }
            .main-content {
                margin-left: 60px;
            }
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-bicycle"></i> 管理平台</h2>
            </div>
            <nav>
                <ul class="nav-menu">
                    <li><a href="#" class="nav-item"><i class="fas fa-home"></i><span>首页</span></a></li>
                    <li><a href="#" class="nav-item active"><i class="fas fa-plus-circle"></i><span>车辆登记</span></a></li>
                    <li><a href="#" class="nav-item"><i class="fas fa-user"></i><span>个人中心</span></a></li>
                    <li><a href="#" class="nav-item"><i class="fas fa-map"></i><span>实时地图</span></a></li>
                    <li><a href="#" class="nav-item"><i class="fas fa-exclamation-triangle"></i><span>违规记录</span></a></li>
                    <li><a href="#" class="nav-item"><i class="fas fa-chart-bar"></i><span>数据分析</span></a></li>
                    <li><a href="#" class="nav-item"><i class="fas fa-cog"></i><span>系统设置</span></a></li>
                    <li><a href="#" class="nav-item"><i class="fas fa-sign-out-alt"></i><span>退出登录</span></a></li>
                </ul>
            </nav>
        </aside>
        <main class="main-content">
            <div class="user-header">
                <div class="user-info">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-details">
                        <h3>张三</h3>
                        <p>学号：2021001234 | 计算机科学与技术学院</p>
                    </div>
                </div>
                <div class="user-actions">
                    <button class="btn btn-outline"><i class="fas fa-edit"></i> 编辑资料</button>
                    <button class="btn btn-primary"><i class="fas fa-plus"></i> 添加车辆</button>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title"><i class="fas fa-car"></i> 车辆信息登记</h3>
                </div>
                <div class="card-body">
                    <form id="vehicleForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="vehicleType">车辆类型</label>
                                <select id="vehicleType" class="form-control" required>
                                    <option value="">请选择车辆类型</option>
                                    <option value=" bicycle">自行车</option>
                                    <option value=" electricBike">电动自行车</option>
                                    <option value=" motorcycle">摩托车</option>
                                    <option value=" other">其他</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="brandModel">品牌型号</label>
                                <input type="text" id="brandModel" class="form-control" placeholder="请输入品牌型号" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="licensePlate">车牌号码</label>
                            <input type="text" id="licensePlate" class="form-control" placeholder="请输入车牌号码" required>
                        </div>
                        <div class="form-group">
                            <label>车辆照片</label>
                            <div class="upload-area" id="uploadArea">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <p>点击或拖拽文件到此处上传</p>
                                <p class="small">支持 JPG、PNG 格式，大小不超过 5MB</p>
                                <input type="file" id="imageUpload" accept="image/*" style="display: none;">
                            </div>
                            <div class="upload-preview" id="uploadPreview" style="display: none;">
                                <img id="previewImage" src="" alt="预览图片">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="description">备注说明</label>
                            <textarea id="description" class="form-control" rows="3" placeholder="可填写车辆特殊说明"></textarea>
                        </div>
                        <div class="btn-group">
                            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> 提交审核</button>
                            <button type="button" class="btn btn-secondary"><i class="fas fa-file-alt"></i> 保存草稿</button>
                            <button type="reset" class="btn btn-outline"><i class="fas fa-redo"></i> 重置表单</button>
                        </div>
                    </form>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title"><i class="fas fa-sticky-note"></i> 草稿管理</h3>
                </div>
                <div class="card-body">
                    <p>您有未提交的草稿，上次保存时间：<strong>2024-01-20 14:30</strong></p>
                    <button class="btn btn-outline" style="margin-top: 10px;"><i class="fas fa-folder-open"></i> 查看草稿</button>
                </div>
            </div>
        </main>
    </div>
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const imageUpload = document.getElementById('imageUpload');
        const uploadPreview = document.getElementById('uploadPreview');
        const previewImage = document.getElementById('previewImage');
        uploadArea.addEventListener('click', () => {
            imageUpload.click();
        });
        imageUpload.addEventListener('change', function(e) {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    uploadPreview.style.display = 'block';
                }
                reader.readAsDataURL(this.files[0]);
            }
        });
        const vehicleForm = document.getElementById('vehicleForm');
        vehicleForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const vehicleType = document.getElementById('vehicleType').value;
            const brandModel = document.getElementById('brandModel').value;
            const licensePlate = document.getElementById('licensePlate').value;
            if (!vehicleType || !brandModel || !licensePlate) {
                alert('请填写所有必填项！');
                return;
            }
            alert('车辆信息已提交审核，等待管理员审核！');
            this.reset();
            uploadPreview.style.display = 'none';
        });
        window.addEventListener('resize', function() {
        });
    </script>
</body>
</html>
