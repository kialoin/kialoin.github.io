<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据分析仪表盘 - 非机动车管理系统</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
            background-color: #f5f5f5;
        }
        .navbar {
            background-color: #fff;
            border-bottom: 1px solid #e0e0e0;
            height: 60px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        .navbar-container {
            max-width: 1400px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }
        .navbar-brand {
            font-size: 18px;
            font-weight: 600;
            color: #1976d2;
            margin-right: 40px;
        }
        .navbar-menu {
            display: flex;
            list-style: none;
            flex: 1;
        }
        .navbar-item {
            margin-right: 30px;
        }
        .navbar-link {
            color: #666;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .navbar-link:hover {
            background-color: #f5f5f5;
            color: #1976d2;
        }
        .navbar-link.active {
            background-color: #1976d2;
            color: #fff;
        }
        .navbar-user {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .notification-badge {
            position: relative;
            cursor: pointer;
        }
        .notification-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #f44336;
            color: #fff;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 10px;
        }
        .main-container {
            margin-top: 60px;
            height: calc(100vh - 60px);
            display: flex;
            flex-direction: column;
        }
        .toolbar {
            background-color: #fff;
            border-bottom: 1px solid #e0e0e0;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .toolbar-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        .toolbar-filters {
            display: flex;
            gap: 15px;
        }
        .filter-select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .export-btn {
            padding: 8px 15px;
            background-color: #1976d2;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s;
        }
        .export-btn:hover {
            background-color: #1565c0;
        }
        .charts-container {
            flex: 1;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 20px;
        }
        .chart-card {
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        .chart-actions {
            display: flex;
            gap: 10px;
        }
        .chart-action-btn {
            padding: 4px 8px;
            background-color: #f5f5f5;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .chart-action-btn:hover {
            background-color: #e0e0e0;
        }
        .chart-wrapper {
            flex: 1;
            min-height: 200px;
        }
        @media (max-width: 768px) {
            .charts-container {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(4, 1fr);
            }
            .toolbar {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
            .toolbar-filters {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <button class="mobile-menu-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <div class="navbar-brand">
                <i class="fas fa-bicycle"></i> 非机动车管理系统
            </div>
            <ul class="navbar-menu">
                <li class="navbar-item">
                    <a href="#" class="navbar-link">
                        <i class="fas fa-home"></i> 首页
                    </a>
                </li>
                <li class="navbar-item">
                    <a href="#" class="navbar-link">
                        <i class="fas fa-plus-circle"></i> 车辆登记
                    </a>
                </li>
                <li class="navbar-item">
                    <a href="#" class="navbar-link">
                        <i class="fas fa-user"></i> 个人中心
                    </a>
                </li>
                <li class="navbar-item">
                    <a href="#" class="navbar-link">
                        <i class="fas fa-map-marked-alt"></i> 实时监控
                    </a>
                </li>
                <li class="navbar-item">
                    <a href="#" class="navbar-link">
                        <i class="fas fa-exclamation-triangle"></i> 违规查询
                    </a>
                </li>
                <li class="navbar-item">
                    <a href="#" class="navbar-link">
                        <i class="fas fa-comment-dots"></i> 反馈报修
                    </a>
                </li>
                <li class="navbar-item">
                    <a href="#" class="navbar-link">
                        <i class="fas fa-bell"></i> 消息通知
                    </a>
                </li>
                <li class="navbar-item admin-only">
                    <a href="#" class="navbar-link active">
                        <i class="fas fa-chart-line"></i> 数据分析
                    </a>
                </li>
            </ul>
            <div class="navbar-user">
                <div class="notification-badge">
                    <i class="far fa-bell" style="font-size: 20px; color: #666;"></i>
                    <span class="notification-count">3</span>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <i class="far fa-user-circle" style="font-size: 24px; color: #666;"></i>
                    <span style="font-size: 14px; color: #333;">张三</span>
                </div>
            </div>
        </div>
    </nav>
    <div class="main-container">
        <div class="toolbar">
            <div class="toolbar-title">
                <i class="fas fa-chart-bar"></i> 数据分析仪表盘
            </div>
            <div class="toolbar-filters">
                <select class="filter-select">
                    <option>全部时间段</option>
                    <option>今日</option>
                    <option>本周</option>
                    <option>本月</option>
                    <option>本季度</option>
                    <option>本年</option>
                </select>
                <select class="filter-select">
                    <option>全部区域</option>
                    <option>校园A区</option>
                    <option>校园B区</option>
                    <option>校园C区</option>
                </select>
                <button class="export-btn">
                    <i class="fas fa-download"></i> 导出报表
                </button>
            </div>
        </div>
        <div class="charts-container">
            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-title">车辆数量趋势图</div>
                    <div class="chart-actions">
                        <button class="chart-action-btn"><i class="fas fa-sync"></i></button>
                        <button class="chart-action-btn"><i class="fas fa-expand"></i></button>
                    </div>
                </div>
                <div class="chart-wrapper" id="vehicleTrendChart"></div>
            </div>
            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-title">违规热点区域分布图</div>
                    <div class="chart-actions">
                        <button class="chart-action-btn"><i class="fas fa-sync"></i></button>
                        <button class="chart-action-btn"><i class="fas fa-expand"></i></button>
                    </div>
                </div>
                <div class="chart-wrapper" id="violationHeatmapChart"></div>
            </div>
            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-title">时段统计分析</div>
                    <div class="chart-actions">
                        <button class="chart-action-btn"><i class="fas fa-sync"></i></button>
                        <button class="chart-action-btn"><i class="fas fa-expand"></i></button>
                    </div>
                </div>
                <div class="chart-wrapper" id="timeDistributionChart"></div>
            </div>
            <div class="chart-card">
                <div class="chart-header">
                    <div class="chart-title">AI分析预测结果</div>
                    <div class="chart-actions">
                        <button class="chart-action-btn"><i class="fas fa-sync"></i></button>
                        <button class="chart-action-btn"><i class="fas fa-expand"></i></button>
                    </div>
                </div>
                <div class="chart-wrapper" id="aiPredictionChart"></div>
            </div>
        </div>
    </div>
    <script>
        let vehicleTrendChart, violationHeatmapChart, timeDistributionChart, aiPredictionChart;
        function initCharts() {
            vehicleTrendChart = echarts.init(document.getElementById('vehicleTrendChart'));
            const vehicleTrendOption = {
                tooltip: {
                    trigger: 'axis'
                },
                xAxis: {
                    type: 'category',
                    data: ['周一', '周二', '周三', '周四', '周五', '周六', '周日']
                },
                yAxis: {
                    type: 'value'
                },
                series: [{
                    data: [120, 200, 150, 80, 70, 110, 130],
                    type: 'line',
                    smooth: true,
                    lineStyle: {
                        color: '#1976d2'
                    },
                    areaStyle: {
                        color: 'rgba(25, 118, 210, 0.1)'
                    }
                }]
            };
            vehicleTrendChart.setOption(vehicleTrendOption);
            violationHeatmapChart = echarts.init(document.getElementById('violationHeatmapChart'));
            const violationHeatmapOption = {
                tooltip: {
                    trigger: 'item'
                },
                geo: {
                    map: 'china',
                    roam: false,
                    label: {
                        emphasis: {
                            show: false
                        }
                    },
                    itemStyle: {
                        normal: {
                            areaColor: '#f0f0f0',
                            borderColor: '#ccc'
                        }
                    }
                },
                series: [{
                    type: 'effectScatter',
                    coordinateSystem: 'geo',
                    data: [
                        {name: '北京', value: [116.4074, 39.9042, 120]},
                        {name: '上海', value: [121.4737, 31.2304, 80]},
                        {name: '广州', value: [113.2644, 23.1291, 60]},
                        {name: '深圳', value: [114.0579, 22.5431, 90]}
                    ],
                    symbolSize: function(val) {
                        return val[2] / 10;
                    },
                    itemStyle: {
                        color: '#f44336'
                    }
                }]
            };
            violationHeatmapChart.setOption(violationHeatmapOption);
            timeDistributionChart = echarts.init(document.getElementById('timeDistributionChart'));
            const timeDistributionOption = {
                tooltip: {
                    trigger: 'axis'
                },
                xAxis: {
                    type: 'category',
                    data: ['00:00-06:00', '06:00-12:00', '12:00-18:00', '18:00-24:00']
                },
                yAxis: {
                    type: 'value'
                },
                series: [{
                    data: [10, 30, 50, 20],
                    type: 'bar',
                    itemStyle: {
                        color: '#4caf50'
                    }
                }]
            };
            timeDistributionChart.setOption(timeDistributionOption);
            aiPredictionChart = echarts.init(document.getElementById('aiPredictionChart'));
            const aiPredictionOption = {
                tooltip: {
                    trigger: 'axis'
                },
                xAxis: {
                    type: 'category',
                    data: ['未来1周', '未来2周', '未来3周', '未来4周']
                },
                yAxis: {
                    type: 'value'
                },
                series: [{
                    data: [150, 160, 170, 180],
                    type: 'line',
                    smooth: true,
                    lineStyle: {
                        color: '#ff9800'
                    },
                    symbol: 'circle',
                    symbolSize: 8,
                    itemStyle: {
                        color: '#ff9800'
                    }
                }]
            };
            aiPredictionChart.setOption(aiPredictionOption);
            window.addEventListener('resize', function() {
                vehicleTrendChart.resize();
                violationHeatmapChart.resize();
                timeDistributionChart.resize();
                aiPredictionChart.resize();
            });
        }
        document.addEventListener('DOMContentLoaded', function() {
            initCharts();
        });
    </script>
</body>
</html>
