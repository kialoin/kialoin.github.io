<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置与权限管理 - 非机动车管理系统</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
            background-color: #f5f5f5;
        }
        .navbar {
            background-color: #fff;
            border-bottom: 1px solid #e0e0e0;
            height: 60px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }
        .navbar-container {
            max-width: 1400px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }
        .navbar-brand {
            font-size: 18px;
            font-weight: 600;
            color: #1976d2;
            margin-right: 40px;
        }
        .navbar-menu {
            display: flex;
            list-style: none;
            flex: 1;
        }
        .navbar-item {
            margin-right: 30px;
        }
        .navbar-link {
            color: #666;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .navbar-link:hover {
            background-color: #f5f5f5;
            color: #1976d2;
        }
        .navbar-link.active {
            background-color: #1976d2;
            color: #fff;
        }
        .navbar-user {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .notification-badge {
            position: relative;
            cursor: pointer;
        }
        .notification-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #f44336;
            color: #fff;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 10px;
        }
        .main-container {
            margin-top: 60px;
            height: calc(100vh - 60px);
            display: flex;
        }
        .sidebar {
            width: 280px;
            background-color: #fff;
            border-right: 1px solid #e0e0e0;
            padding: 20px;
            overflow-y: auto;
        }
        .filter-section {
            margin-bottom: 25px;
        }
        .filter-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-title i {
            color: #1976d2;
            font-size: 16px;
        }
        .search-box {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .search-box:focus {
            outline: none;
            border-color: #1976d2;
        }
        .filter-group {
            margin-bottom: 15px;
        }
        .filter-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }
        .filter-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .filter-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-option input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #1976d2;
        }
        .filter-option label {
            cursor: pointer;
            font-size: 14px;
        }
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            font-size: 12px;
            border-radius: 3px;
            margin-left: 5px;
        }
        .status-normal {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
        .status-abnormal {
            background-color: #ffebee;
            color: #c62828;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 10px;
        }
        .btn-primary {
            background-color: #1976d2;
            color: #fff;
        }
        .btn-primary:hover {
            background-color: #1565c0;
        }
        .btn-secondary {
            background-color: #f5f5f5;
            color: #666;
            border: 1px solid #ddd;
        }
        .btn-secondary:hover {
            background-color: #e0e0e0;
        }
        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-title i {
            color: #1976d2;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }
        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
        }
        .form-item {
            flex: 1;
        }
        .form-label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #666;
        }
        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-input:focus {
            outline: none;
            border-color: #1976d2;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #1976d2;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        .permission-tree {
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            padding: 15px;
            margin-top: 10px;
        }
        .tree-node {
            margin-bottom: 10px;
            padding-left: 20px;
            position: relative;
        }
        .tree-node::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 1px;
            background-color: #ddd;
        }
        .tree-node::after {
            content: '';
            position: absolute;
            left: 0;
            top: 12px;
            width: 10px;
            height: 1px;
            background-color: #ddd;
        }
        .tree-node:last-child::before {
            height: 12px;
        }
        .tree-node-header {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 5px 0;
        }
        .tree-node-header i {
            color: #1976d2;
        }
        .tree-node-content {
            margin-top: 10px;
            padding-left: 20px;
        }
        .permission-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 0;
        }
        .save-btn {
            background-color: #4caf50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .save-btn:hover {
            background-color: #45a049;
        }
        @media (max-width: 768px) {
            .sidebar {
                display: none;
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 600;
                box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            }
            .sidebar.mobile-open {
                display: block;
            }
            .mobile-menu-btn {
                display: block;
                background: none;
                border: none;
                font-size: 20px;
                color: #1976d2;
                cursor: pointer;
            }
            .form-row {
                flex-direction: column;
                gap: 15px;
            }
        }
        @media (min-width: 769px) {
            .mobile-menu-btn {
                display: none;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <button class="mobile-menu-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <div class="navbar-brand">
                <i class="fas fa-bicycle"></i> 非机动车管理系统
            </div>
            <ul class="navbar-menu">
                <li class="navbar-item">
                    <a href="#" class="navbar-link">
                        <i class="fas fa-home"></i> 首页
                    </a>
                </li>
                <li class="navbar-item">
                    <a href="#" class="navbar-link">
                        <i class="fas fa-plus-circle"></i> 车辆登记
                    </a>
                </li>
                <li class="navbar-item">
                    <a href="#" class="navbar-link">
                        <i class="fas fa-user"></i> 个人中心
                    </a>
                </li>
                <li class="navbar-item">
                    <a href="#" class="navbar-link">
                        <i class="fas fa-map-marked-alt"></i> 实时监控
                    </a>
                </li>
                <li class="navbar-item">
                    <a href="#" class="navbar-link">
                        <i class="fas fa-exclamation-triangle"></i> 违规查询
                    </a>
                </li>
                <li class="navbar-item">
                    <a href="#" class="navbar-link">
                        <i class="fas fa-comment-dots"></i> 反馈报修
                    </a>
                </li>
                <li class="navbar-item">
                    <a href="#" class="navbar-link">
                        <i class="fas fa-bell"></i> 消息通知
                    </a>
                </li>
                <li class="navbar-item admin-only">
                    <a href="#" class="navbar-link active">
                        <i class="fas fa-cog"></i> 系统设置
                    </a>
                </li>
            </ul>
            <div class="navbar-user">
                <div class="notification-badge">
                    <i class="far fa-bell" style="font-size: 20px; color: #666;"></i>
                    <span class="notification-count">3</span>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <i class="far fa-user-circle" style="font-size: 24px; color: #666;"></i>
                    <span style="font-size: 14px; color: #333;">张三</span>
                </div>
            </div>
        </div>
    </nav>
    <div class="main-container">
        <aside class="sidebar" id="sidebar">
            <div class="filter-section">
                <div class="filter-title">
                    <i class="fas fa-cogs"></i> 系统设置
                </div>
                <div class="filter-group">
                    <div class="filter-options">
                        <div class="filter-option">
                            <a href="#" class="navbar-link active">
                                <i class="fas fa-sliders-h"></i> 系统参数
                            </a>
                        </div>
                        <div class="filter-option">
                            <a href="#" class="navbar-link">
                                <i class="fas fa-users"></i> 用户管理
                            </a>
                        </div>
                        <div class="filter-option">
                            <a href="#" class="navbar-link">
                                <i class="fas fa-shield-alt"></i> 权限配置
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="filter-section">
                <div class="filter-title">
                    <i class="fas fa-bolt"></i> 快捷操作
                </div>
                <div class="filter-group">
                    <div class="filter-options">
                        <div class="filter-option">
                            <a href="#" class="navbar-link">
                                <i class="fas fa-sync-alt"></i> 数据同步
                            </a>
                        </div>
                        <div class="filter-option">
                            <a href="#" class="navbar-link">
                                <i class="fas fa-database"></i> 数据备份
                            </a>
                        </div>
                        <div class="filter-option">
                            <a href="#" class="navbar-link">
                                <i class="fas fa-history"></i> 操作日志
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
        <div class="content-area">
            <h1 class="page-title">
                <i class="fas fa-cog"></i> 系统设置与权限管理
            </h1>
            <div class="form-group">
                <h2 class="form-title">系统参数配置</h2>
                <div class="form-row">
                    <div class="form-item">
                        <label class="form-label">数据存储周期</label>
                        <input type="number" class="form-input" value="30" placeholder="请输入天数">
                    </div>
                    <div class="form-item">
                        <label class="form-label">地图API密钥</label>
                        <input type="password" class="form-input" value="your-api-key-here" placeholder="请输入API密钥">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-item">
                        <label class="form-label">最大并发连接数</label>
                        <input type="number" class="form-input" value="100" placeholder="请输入数字">
                    </div>
                    <div class="form-item">
                        <label class="form-label">缓存过期时间</label>
                        <input type="number" class="form-input" value="3600" placeholder="单位：秒">
                    </div>
                </div>
            </div>
            <div class="form-group">
                <h2 class="form-title">用户权限管理</h2>
                <div class="form-row">
                    <div class="form-item">
                        <label class="form-label">启用多角色权限</label>
                        <label class="switch">
                            <input type="checkbox" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="form-item">
                        <label class="form-label">启用审计日志</label>
                        <label class="switch">
                            <input type="checkbox" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <h2 class="form-title">权限分配</h2>
                <div class="permission-tree">
                    <div class="tree-node">
                        <div class="tree-node-header">
                            <i class="fas fa-folder"></i>
                            <span>系统管理</span>
                        </div>
                        <div class="tree-node-content">
                            <div class="permission-item">
                                <input type="checkbox" id="sys-config" checked>
                                <label for="sys-config">系统配置</label>
                            </div>
                            <div class="permission-item">
                                <input type="checkbox" id="user-mgmt" checked>
                                <label for="user-mgmt">用户管理</label>
                            </div>
                            <div class="permission-item">
                                <input type="checkbox" id="role-mgmt" checked>
                                <label for="role-mgmt">角色管理</label>
                            </div>
                        </div>
                    </div>
                    <div class="tree-node">
                        <div class="tree-node-header">
                            <i class="fas fa-car"></i>
                            <span>车辆管理</span>
                        </div>
                        <div class="tree-node-content">
                            <div class="permission-item">
                                <input type="checkbox" id="vehicle-view" checked>
                                <label for="vehicle-view">查看车辆</label>
                            </div>
                            <div class="permission-item">
                                <input type="checkbox" id="vehicle-edit">
                                <label for="vehicle-edit">编辑车辆</label>
                            </div>
                            <div class="permission-item">
                                <input type="checkbox" id="vehicle-delete">
                                <label for="vehicle-delete">删除车辆</label>
                            </div>
                        </div>
                    </div>
                    <div class="tree-node">
                        <div class="tree-node-header">
                            <i class="fas fa-map-marked-alt"></i>
                            <span>监控管理</span>
                        </div>
                        <div class="tree-node-content">
                            <div class="permission-item">
                                <input type="checkbox" id="monitor-view" checked>
                                <label for="monitor-view">查看监控</label>
                            </div>
                            <div class="permission-item">
                                <input type="checkbox" id="monitor-track">
                                <label for="monitor-track">轨迹追踪</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <button class="save-btn">
                <i class="fas fa-save"></i> 保存配置
            </button>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const treeHeaders = document.querySelectorAll('.tree-node-header');
            treeHeaders.forEach(header => {
                header.addEventListener('click', function() {
                    const content = this.nextElementSibling;
                    if (content.style.display === 'none') {
                        content.style.display = 'block';
                    } else {
                        content.style.display = 'none';
                    }
                });
            });
            const switches = document.querySelectorAll('.switch input');
            switches.forEach(switchEl => {
                switchEl.addEventListener('change', function() {
                });
            });
            const saveBtn = document.querySelector('.save-btn');
            saveBtn.addEventListener('click', function() {
                alert('系统配置已成功保存！');
            });
        });
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('mobile-open');
        }
    </script>
</body>
</html>
