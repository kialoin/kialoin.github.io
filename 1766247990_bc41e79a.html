<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.5;
        }
        .container {
            display: flex;
            min-height: 100vh;
        }
        .navbar {
            width: 240px;
            background-color: #ffffff;
            border-right: 1px solid #e1e4e8;
            display: flex;
            flex-direction: column;
        }
        .nav-header {
            padding: 20px;
            border-bottom: 1px solid #e1e4e8;
        }
        .nav-header h1 {
            font-size: 18px;
            color: #24292e;
        }
        .nav-menu {
            flex: 1;
            padding: 10px 0;
        }
        .nav-item {
            padding: 12px 20px;
            font-size: 14px;
            color: #586069;
            display: flex;
            align-items: center;
            text-decoration: none;
        }
        .nav-item:hover,
        .nav-item.active {
            background-color: #f1f8ff;
            color: #0366d6;
            border-left: 3px solid #0366d6;
        }
        .nav-item i {
            margin-right: 10px;
            font-size: 16px;
        }
        .user-panel {
            padding: 20px;
            border-top: 1px solid #e1e4e8;
            display: flex;
            align-items: center;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background-color: #0366d6;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: bold;
        }
        .user-info {
            flex: 1;
        }
        .user-name {
            font-size: 14px;
            font-weight: 500;
            color: #24292e;
        }
        .user-actions {
            display: flex;
            gap: 15px;
        }
        .user-action {
            color: #586069;
            font-size: 16px;
        }
        .main-content {
            flex: 1;
            padding: 20px;
        }
        .page-header {
            margin-bottom: 20px;
        }
        .page-title {
            font-size: 24px;
            color: #24292e;
            margin-bottom: 5px;
        }
        .page-description {
            font-size: 14px;
            color: #586069;
        }
        .form-container {
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 4px;
            padding: 30px;
            max-width: 500px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #24292e;
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e1e4e8;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: #0366d6;
            box-shadow: 0 0 0 2px rgba(3, 102, 214, 0.2);
        }
        .password-strength {
            margin-top: 5px;
            font-size: 12px;
        }
        .strength-weak { color: #d73a49; }
        .strength-medium { color: #dbab09; }
        .strength-strong { color: #28a745; }
        .form-row {
            display: flex;
            gap: 20px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .form-checkbox {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .form-checkbox input {
            margin-right: 8px;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #0366d6;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .submit-btn:hover {
            background-color: #0356b8;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #586069;
        }
        .login-link a {
            color: #0366d6;
            text-decoration: none;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            color: #d73a49;
            font-size: 12px;
            margin-top: 5px;
        }
        .success-message {
            color: #28a745;
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="nav-header">
                <h1><i class="fas fa-boxes"></i> 库存管理系统</h1>
            </div>
            <div class="nav-menu">
                <a href="#" class="nav-item">
                    <i class="fas fa-home"></i> 仪表盘
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-box"></i> 产品管理
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-exchange-alt"></i> 库存操作
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-search"></i> 查询与报表
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-bell"></i> 预警设置
                </a>
                <a href="#" class="nav-item active">
                    <i class="fas fa-user-plus"></i> 用户注册
                </a>
            </div>
            <div class="user-panel">
                <div class="user-avatar">U</div>
                <div class="user-info">
                    <div class="user-name">管理员</div>
                </div>
                <div class="user-actions">
                    <a href="#" class="user-action"><i class="far fa-bell"></i></a>
                    <a href="#" class="user-action"><i class="fas fa-cog"></i></a>
                </div>
            </div>
        </nav>
        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">用户注册</h1>
                <p class="page-description">创建您的账户，开始使用库存管理系统</p>
            </div>
            <div class="form-container">
                <form id="registerForm">
                    <div class="form-group">
                        <label class="form-label" for="username">用户名</label>
                        <input type="text" id="username" class="form-input" placeholder="请输入用户名" required>
                        <div class="error-message" id="username-error"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="email">邮箱地址</label>
                        <input type="email" id="email" class="form-input" placeholder="请输入邮箱地址" required>
                        <div class="error-message" id="email-error"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="password">密码</label>
                            <input type="password" id="password" class="form-input" placeholder="请输入密码" required>
                            <div class="password-strength" id="password-strength"></div>
                            <div class="error-message" id="password-error"></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="confirmPassword">确认密码</label>
                            <input type="password" id="confirmPassword" class="form-input" placeholder="请再次输入密码" required>
                            <div class="error-message" id="confirm-password-error"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">权限角色</label>
                        <div class="form-checkbox">
                            <input type="radio" id="admin" name="role" value="admin" required>
                            <label for="admin">管理员</label>
                        </div>
                        <div class="form-checkbox">
                            <input type="radio" id="user" name="role" value="user" checked required>
                            <label for="user">普通用户</label>
                        </div>
                    </div>
                    <button type="submit" class="submit-btn">注册账户</button>
                    <div class="login-link">
                        已有账户？<a href="#">立即登录</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script>
        function checkPasswordStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            const strengthText = ['弱', '较弱', '中等', '较强', '强'];
            const strengthClass = ['strength-weak', 'strength-weak', 'strength-medium', 'strength-medium', 'strength-strong'];
            return {
                strength: strength,
                text: strengthText[strength],
                class: strengthClass[strength]
            };
        }
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthElement = document.getElementById('password-strength');
            if (password.length > 0) {
                const result = checkPasswordStrength(password);
                strengthElement.textContent = `密码强度: ${result.text}`;
                strengthElement.className = `password-strength ${result.class}`;
            } else {
                strengthElement.textContent = '';
                strengthElement.className = 'password-strength';
            }
        });
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.querySelectorAll('.error-message').forEach(el => el.textContent = '');
            let isValid = true;
            const username = document.getElementById('username').value;
            if (username.length < 3) {
                document.getElementById('username-error').textContent = '用户名至少需要3个字符';
                isValid = false;
            }
            const email = document.getElementById('email').value;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                document.getElementById('email-error').textContent = '请输入有效的邮箱地址';
                isValid = false;
            }
            const password = document.getElementById('password').value;
            if (password.length < 8) {
                document.getElementById('password-error').textContent = '密码至少需要8个字符';
                isValid = false;
            }
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (password !== confirmPassword) {
                document.getElementById('confirm-password-error').textContent = '两次输入的密码不一致';
                isValid = false;
            }
            if (isValid) {
                alert('注册成功！正在跳转到登录页面...');
            }
        });
        document.addEventListener('DOMContentLoaded', function() {
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                if (item.querySelector('i').className.includes('fa-user-plus')) {
                    item.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
