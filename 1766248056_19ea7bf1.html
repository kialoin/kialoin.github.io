<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>库存管理系统 - 库存操作</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.0/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.5;
        }
        .container {
            display: flex;
            min-height: 100vh;
        }
        .navbar {
            width: 240px;
            background-color: #ffffff;
            border-right: 1px solid #e1e4e8;
            display: flex;
            flex-direction: column;
        }
        .nav-header {
            padding: 20px;
            border-bottom: 1px solid #e1e4e8;
        }
        .nav-header h1 {
            font-size: 18px;
            color: #24292e;
        }
        .nav-menu {
            flex: 1;
            padding: 10px 0;
        }
        .nav-item {
            padding: 12px 20px;
            font-size: 14px;
            color: #586069;
            display: flex;
            align-items: center;
            text-decoration: none;
        }
        .nav-item:hover,
        .nav-item.active {
            background-color: #f1f8ff;
            color: #0366d6;
            border-left: 3px solid #0366d6;
        }
        .nav-item i {
            margin-right: 10px;
            font-size: 16px;
        }
        .user-panel {
            padding: 20px;
            border-top: 1px solid #e1e4e8;
            display: flex;
            align-items: center;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background-color: #0366d6;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: bold;
        }
        .user-info {
            flex: 1;
        }
        .user-name {
            font-size: 14px;
            font-weight: 500;
            color: #24292e;
        }
        .user-actions {
            display: flex;
            gap: 15px;
        }
        .user-action {
            color: #586069;
            font-size: 16px;
        }
        .main-content {
            flex: 1;
            padding: 20px;
        }
        .page-header {
            margin-bottom: 20px;
        }
        .page-title {
            font-size: 24px;
            color: #24292e;
            margin-bottom: 5px;
        }
        .page-description {
            font-size: 14px;
            color: #586069;
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid #e1e4e8;
            margin-bottom: 20px;
        }
        .tab {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 14px;
            color: #586069;
            border-bottom: 2px solid transparent;
        }
        .tab.active {
            color: #0366d6;
            border-bottom: 2px solid #0366d6;
            font-weight: 500;
        }
        .form-container {
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            color: #24292e;
            margin-bottom: 5px;
        }
        .form-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #e1e4e8;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-input:focus {
            outline: none;
            border-color: #0366d6;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .btn-primary {
            background-color: #0366d6;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0356b3;
        }
        .btn-secondary {
            background-color: #f6f8fa;
            color: #586069;
            border: 1px solid #e1e4e8;
        }
        .btn-secondary:hover {
            background-color: #e1e4e8;
        }
        .result-section {
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 4px;
            padding: 20px;
        }
        .result-title {
            font-size: 16px;
            font-weight: 500;
            color: #24292e;
            margin-bottom: 15px;
        }
        .result-content {
            font-size: 14px;
            color: #586069;
        }
        .result-highlight {
            color: #0366d6;
            font-weight: 500;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .navbar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #e1e4e8;
            }
            .tabs {
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="nav-header">
                <h1><i class="fas fa-boxes"></i> 库存管理系统</h1>
            </div>
            <div class="nav-menu">
                <a href="#" class="nav-item">
                    <i class="fas fa-home"></i> 仪表盘
                </a>
                <a href="#" class="nav-item active">
                    <i class="fas fa-exchange-alt"></i> 库存操作
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-search"></i> 查询与报表
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-bell"></i> 预警设置
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-cog"></i> 系统管理
                </a>
            </div>
            <div class="user-panel">
                <div class="user-avatar">U</div>
                <div class="user-info">
                    <div class="user-name">管理员</div>
                </div>
                <div class="user-actions">
                    <a href="#" class="user-action"><i class="far fa-bell"></i></a>
                    <a href="#" class="user-action"><i class="fas fa-cog"></i></a>
                </div>
            </div>
        </nav>
        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">库存操作</h1>
                <p class="page-description">提供入库登记、出库处理、库存调拨和盘点功能的多标签页界面</p>
            </div>
            <div class="tabs">
                <div class="tab active" data-tab="inbound">入库登记</div>
                <div class="tab" data-tab="outbound">出库处理</div>
                <div class="tab" data-tab="transfer">库存调拨</div>
                <div class="tab" data-tab="inventory">库存盘点</div>
            </div>
            <div class="form-container" id="inbound-form">
                <h3 style="margin-bottom: 15px;">入库登记</h3>
                <div class="form-group">
                    <label class="form-label">产品选择</label>
                    <select class="form-input">
                        <option>请选择产品</option>
                        <option>H型钢 200*100*5.5*8</option>
                        <option>螺纹钢 Φ12mm HRB400</option>
                        <option>钢板 10mm*1500*6000</option>
                        <option>圆钢 Φ20mm Q235</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">入库数量</label>
                    <input type="number" class="form-input" placeholder="请输入入库数量">
                </div>
                <div class="form-group">
                    <label class="form-label">备注信息</label>
                    <input type="text" class="form-input" placeholder="请输入备注信息">
                </div>
                <button class="btn btn-primary">确认入库</button>
            </div>
            <div class="form-container" id="outbound-form" style="display: none;">
                <h3 style="margin-bottom: 15px;">出库处理</h3>
                <div class="form-group">
                    <label class="form-label">产品选择</label>
                    <select class="form-input">
                        <option>请选择产品</option>
                        <option>H型钢 200*100*5.5*8</option>
                        <option>螺纹钢 Φ12mm HRB400</option>
                        <option>钢板 10mm*1500*6000</option>
                        <option>圆钢 Φ20mm Q235</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">出库数量</label>
                    <input type="number" class="form-input" placeholder="请输入出库数量">
                </div>
                <div class="form-group">
                    <label class="form-label">用途说明</label>
                    <input type="text" class="form-input" placeholder="请输入用途说明">
                </div>
                <button class="btn btn-primary">确认出库</button>
            </div>
            <div class="form-container" id="transfer-form" style="display: none;">
                <h3 style="margin-bottom: 15px;">库存调拨</h3>
                <div class="form-group">
                    <label class="form-label">调出仓库</label>
                    <select class="form-input">
                        <option>主仓库</option>
                        <option>分仓库A</option>
                        <option>分仓库B</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">产品选择</label>
                    <select class="form-input">
                        <option>请选择产品</option>
                        <option>H型钢 200*100*5.5*8</option>
                        <option>螺纹钢 Φ12mm HRB400</option>
                        <option>钢板 10mm*1500*6000</option>
                        <option>圆钢 Φ20mm Q235</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">调拨数量</label>
                    <input type="number" class="form-input" placeholder="请输入调拨数量">
                </div>
                <div class="form-group">
                    <label class="form-label">调入仓库</label>
                    <select class="form-input">
                        <option>主仓库</option>
                        <option>分仓库A</option>
                        <option>分仓库B</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">调拨原因</label>
                    <input type="text" class="form-input" placeholder="请输入调拨原因">
                </div>
                <button class="btn btn-primary">确认调拨</button>
            </div>
            <div class="form-container" id="inventory-form" style="display: none;">
                <h3 style="margin-bottom: 15px;">库存盘点</h3>
                <div class="form-group">
                    <label class="form-label">盘点类型</label>
                    <select class="form-input">
                        <option>全盘</option>
                        <option>抽盘</option>
                        <option>专项盘点</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">产品选择</label>
                    <select class="form-input">
                        <option>请选择产品</option>
                        <option>H型钢 200*100*5.5*8</option>
                        <option>螺纹钢 Φ12mm HRB400</option>
                        <option>钢板 10mm*1500*6000</option>
                        <option>圆钢 Φ20mm Q235</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">实际库存</label>
                    <input type="number" class="form-input" placeholder="请输入实际库存数量">
                </div>
                <div class="form-group">
                    <label class="form-label">盘点日期</label>
                    <input type="date" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">盘点人员</label>
                    <input type="text" class="form-input" placeholder="请输入盘点人员姓名">
                </div>
                <button class="btn btn-primary">提交盘点结果</button>
            </div>
            <div class="result-section">
                <div class="result-title">操作结果</div>
                <div class="result-content">
                    当前库存状态：<span class="result-highlight">H型钢 200*100*5.5*8 - 12,842件</span><br>
                    最近一次操作：入库登记 - <span class="result-highlight">+156件</span><br>
                    操作时间：2023年10月30日 14:30<br>
                    交易记录已生成并保存至数据库
                </div>
            </div>
        </main>
    </div>
    <script>
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.form-container').forEach(f => f.style.display = 'none');
                this.classList.add('active');
                const tabId = this.getAttribute('data-tab');
                document.getElementById(`${tabId}-form`).style.display = 'block';
            });
        });
        document.querySelectorAll('.btn-primary').forEach(button => {
            button.addEventListener('click', function(e) {
                e.preventDefault();
                const form = this.closest('.form-container');
                const productName = form.querySelector('select').value || '未知产品';
                const quantity = form.querySelector('input[type="number"]').value || '0';
                const resultContent = document.querySelector('.result-content');
                resultContent.innerHTML = `
                    当前库存状态：<span class="result-highlight">${productName} - 12,998件</span><br>
                    最近一次操作：${this.textContent} - <span class="result-highlight">+${quantity}件</span><br>
                    操作时间：${new Date().toLocaleString()}<br>
                    交易记录已生成并保存至数据库
                `;
                resultContent.scrollIntoView({ behavior: 'smooth' });
            });
        });
    </script>
</body>
</html>
