<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>库存管理系统 - 系统设置</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.0/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.5;
        }
        .container {
            display: flex;
            min-height: 100vh;
        }
        .navbar {
            width: 240px;
            background-color: #ffffff;
            border-right: 1px solid #e1e4e8;
            display: flex;
            flex-direction: column;
        }
        .nav-header {
            padding: 20px;
            border-bottom: 1px solid #e1e4e8;
        }
        .nav-header h1 {
            font-size: 18px;
            color: #24292e;
        }
        .nav-menu {
            flex: 1;
            padding: 10px 0;
        }
        .nav-item {
            padding: 12px 20px;
            font-size: 14px;
            color: #586069;
            display: flex;
            align-items: center;
            text-decoration: none;
        }
        .nav-item:hover,
        .nav-item.active {
            background-color: #f1f8ff;
            color: #0366d6;
            border-left: 3px solid #0366d6;
        }
        .nav-item i {
            margin-right: 10px;
            font-size: 16px;
        }
        .user-panel {
            padding: 20px;
            border-top: 1px solid #e1e4e8;
            display: flex;
            align-items: center;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background-color: #0366d6;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: bold;
        }
        .user-info {
            flex: 1;
        }
        .user-name {
            font-size: 14px;
            font-weight: 500;
            color: #24292e;
        }
        .user-actions {
            display: flex;
            gap: 15px;
        }
        .user-action {
            color: #586069;
            font-size: 16px;
        }
        .main-content {
            flex: 1;
            padding: 20px;
        }
        .page-header {
            margin-bottom: 20px;
        }
        .page-title {
            font-size: 24px;
            color: #24292e;
            margin-bottom: 5px;
        }
        .page-description {
            font-size: 14px;
            color: #586069;
        }
        .form-container {
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-section {
            margin-bottom: 30px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 500;
            color: #24292e;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e1e4e8;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-label {
            display: block;
            font-size: 14px;
            color: #24292e;
            margin-bottom: 5px;
        }
        .form-control {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #e1e4e8;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: #0366d6;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-primary {
            background-color: #0366d6;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0356b6;
        }
        .btn-secondary {
            background-color: #f1f8ff;
            color: #0366d6;
        }
        .btn-secondary:hover {
            background-color: #e1f0ff;
        }
        .btn-test {
            background-color: #28a745;
            color: white;
        }
        .btn-test:hover {
            background-color: #218838;
        }
        .alerts-section {
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 4px;
            padding: 20px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 500;
            color: #24292e;
        }
        .alert-list {
            list-style: none;
        }
        .alert-item {
            padding: 12px 0;
            border-bottom: 1px solid #eaecef;
            display: flex;
            align-items: center;
        }
        .alert-item:last-child {
            border-bottom: none;
        }
        .alert-icon {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background-color: #ffdce0;
            color: #cb2431;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 16px;
        }
        .alert-content {
            flex: 1;
        }
        .alert-product {
            font-size: 14px;
            font-weight: 500;
            color: #24292e;
            margin-bottom: 2px;
        }
        .alert-type {
            font-size: 12px;
            color: #586069;
        }
        .alert-time {
            font-size: 12px;
            color: #586069;
        }
        .alert-action {
            color: #0366d6;
            font-size: 14px;
            text-decoration: none;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="nav-header">
                <h1><i class="fas fa-boxes"></i> 库存管理系统</h1>
            </div>
            <div class="nav-menu">
                <a href="#" class="nav-item">
                    <i class="fas fa-home"></i> 仪表盘
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-box"></i> 产品管理
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-exchange-alt"></i> 库存操作
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-search"></i> 查询与报表
                </a>
                <a href="#" class="nav-item">
                    <i class="fas fa-bell"></i> 预警设置
                </a>
                <a href="#" class="nav-item active">
                    <i class="fas fa-cog"></i> 系统管理
                </a>
            </div>
            <div class="user-panel">
                <div class="user-avatar">U</div>
                <div class="user-info">
                    <div class="user-name">管理员</div>
                </div>
                <div class="user-actions">
                    <a href="#" class="user-action"><i class="far fa-bell"></i></a>
                    <a href="#" class="user-action"><i class="fas fa-cog"></i></a>
                </div>
            </div>
        </nav>
        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title">系统设置</h1>
                <p class="page-description">全局配置界面，包含企业微信集成配置、SMTP邮件服务器设置、系统参数调整等功能。采用分组表单布局，支持配置测试和保存验证机制。</p>
            </div>
            <div class="form-container">
                <div class="form-section">
                    <h2 class="section-title">企业微信集成配置</h2>
                    <div class="form-group">
                        <label class="form-label">企业ID</label>
                        <input type="text" class="form-control" placeholder="请输入企业ID">
                    </div>
                    <div class="form-group">
                        <label class="form-label">应用ID</label>
                        <input type="text" class="form-control" placeholder="请输入应用ID">
                    </div>
                    <div class="form-group">
                        <label class="form-label">应用密钥</label>
                        <input type="password" class="form-control" placeholder="请输入应用密钥">
                    </div>
                    <div class="form-group">
                        <label class="form-label">回调URL</label>
                        <input type="text" class="form-control" placeholder="请输入回调URL">
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-test">测试连接</button>
                        <button class="btn btn-primary">保存配置</button>
                    </div>
                </div>
            </div>
            <div class="form-container">
                <div class="form-section">
                    <h2 class="section-title">SMTP邮件服务器设置</h2>
                    <div class="form-group">
                        <label class="form-label">SMTP服务器地址</label>
                        <input type="text" class="form-control" placeholder="例如：smtp.example.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">SMTP端口</label>
                        <input type="text" class="form-control" placeholder="例如：587">
                    </div>
                    <div class="form-group">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-control" placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-control" placeholder="请输入密码">
                    </div>
                    <div class="form-group">
                        <label class="form-label">发件人邮箱</label>
                        <input type="email" class="form-control" placeholder="请输入发件人邮箱">
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-test">测试连接</button>
                        <button class="btn btn-primary">保存配置</button>
                    </div>
                </div>
            </div>
            <div class="form-container">
                <div class="form-section">
                    <h2 class="section-title">系统参数调整</h2>
                    <div class="form-group">
                        <label class="form-label">默认库存预警阈值</label>
                        <input type="number" class="form-control" placeholder="请输入预警阈值">
                    </div>
                    <div class="form-group">
                        <label class="form-label">库存安全系数</label>
                        <input type="number" class="form-control" placeholder="请输入安全系数">
                    </div>
                    <div class="form-group">
                        <label class="form-label">数据保留周期（天）</label>
                        <input type="number" class="form-control" placeholder="请输入数据保留天数">
                    </div>
                    <div class="form-group">
                        <label class="form-label">默认打印模板</label>
                        <select class="form-control">
                            <option>标准模板</option>
                            <option>简洁模板</option>
                            <option>详细模板</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-primary">保存配置</button>
                    </div>
                </div>
            </div>
            <div class="alerts-section">
                <div class="section-header">
                    <div class="section-title">最近系统通知</div>
                    <a href="#" class="alert-action">查看全部</a>
                </div>
                <ul class="alert-list">
                    <li class="alert-item">
                        <div class="alert-icon">
                            <i class="fas fa-info-circle"></i>
                        </div>
                        <div class="alert-content">
                            <div class="alert-product">系统配置更新成功</div>
                            <div class="alert-type">配置已保存</div>
                        </div>
                        <div class="alert-time">5分钟前</div>
                    </li>
                    <li class="alert-item">
                        <div class="alert-icon">
                            <i class="fas fa-check-circle"></i>
                        </div>
                        <div class="alert-content">
                            <div class="alert-product">企业微信连接测试通过</div>
                            <div class="alert-type">网络连接正常</div>
                        </div>
                        <div class="alert-time">1小时前</div>
                    </li>
                    <li class="alert-item">
                        <div class="alert-icon">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <div class="alert-content">
                            <div class="alert-product">SMTP邮件服务器测试通过</div>
                            <div class="alert-type">发送测试邮件成功</div>
                        </div>
                        <div class="alert-time">2小时前</div>
                    </li>
                </ul>
            </div>
        </main>
    </div>
</body>
</html>
