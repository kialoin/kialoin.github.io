<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>仪表盘首页</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    body {
      background-color: #f5f5f5;
      color: #333;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #ffffff;
      padding: 0 20px;
      height: 60px;
      border-bottom: 1px solid #ddd;
    }
    .logo {
      font-weight: bold;
      font-size: 18px;
      color: #000;
    }
    .nav-links {
      display: flex;
      gap: 20px;
    }
    .nav-links a {
      text-decoration: none;
      color: #333;
      font-size: 14px;
    }
    .nav-links a:hover {
      color: #007bff;
    }
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      background-color: #fff;
      border: 1px solid #ddd;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    .overview-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .card {
      background-color: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      padding: 20px;
      text-align: center;
    }
    .card h3 {
      font-size: 16px;
      margin-bottom: 10px;
      color: #6c757d;
    }
    .card .value {
      font-size: 24px;
      font-weight: bold;
      color: #007bff;
    }
    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }
    .chart-container {
      height: 300px;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      padding: 10px;
    }
    .quick-access {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }
    .quick-item {
      text-align: center;
      padding: 20px;
      background-color: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .quick-item:hover {
      background-color: #e9ecef;
      transform: translateY(-3px);
    }
    .quick-item i {
      font-size: 24px;
      color: #007bff;
      margin-bottom: 10px;
    }
    .quick-item span {
      display: block;
      font-weight: bold;
      color: #333;
    }
    @media (max-width: 768px) {
      .charts {
        grid-template-columns: 1fr;
      }
      .overview-cards {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">钢材库存管理系统</div>
    <div class="nav-links">
      <a href="#" style="color:#007bff;">仪表盘首页</a>
      <a href="#">库存信息管理</a>
      <a href="#">实时库存查询</a>
      <a href="#">出入库操作</a>
      <a href="#">库存统计与报表</a>
      <a href="#">AI智能分析</a>
      <a href="#">系统设置</a>
      <a href="#">用户权限管理</a>
      <a href="#">消息通知</a>
    </div>
  </nav>
  <div class="container">
    <h1>仪表盘首页</h1>
    <div class="overview-cards">
      <div class="card">
        <h3>总库存量</h3>
        <div class="value">120.5 吨</div>
      </div>
      <div class="card">
        <h3>预警库存</h3>
        <div class="value">3 项</div>
      </div>
      <div class="card">
        <h3>今日入库</h3>
        <div class="value">25.0 吨</div>
      </div>
      <div class="card">
        <h3>今日出库</h3>
        <div class="value">18.5 吨</div>
      </div>
    </div>
    <div class="charts">
      <div id="inventoryChart" class="chart-container"></div>
      <div id="trendChart" class="chart-container"></div>
    </div>
    <h2>快捷入口</h2>
    <div class="quick-access">
      <div class="quick-item">
        <i class="fas fa-database"></i>
        <span>库存信息管理</span>
      </div>
      <div class="quick-item">
        <i class="fas fa-search"></i>
        <span>实时库存查询</span>
      </div>
      <div class="quick-item">
        <i class="fas fa-sign-in-alt"></i>
        <span>出入库操作</span>
      </div>
      <div class="quick-item">
        <i class="fas fa-chart-bar"></i>
        <span>统计与报表</span>
      </div>
      <div class="quick-item">
        <i class="fas fa-robot"></i>
        <span>AI智能分析</span>
      </div>
      <div class="quick-item">
        <i class="fas fa-cog"></i>
        <span>系统设置</span>
      </div>
    </div>
  </div>
  <script>
    var inventoryChart = echarts.init(document.getElementById('inventoryChart'));
    var inventoryOption = {
      title: {
        text: '库存分布情况',
        left: 'center'
      },
      tooltip: {
        trigger: 'item'
      },
      legend: {
        top: 'bottom'
      },
      series: [
        {
          name: '库存分布',
          type: 'pie',
          radius: ['40%', '70%'],
          avoidLabelOverlap: false,
          itemStyle: {
            borderRadius: 10,
            borderColor: '#fff',
            borderWidth: 2
          },
          label: {
            show: false,
            position: 'center'
          },
          emphasis: {
            label: {
              show: true,
              fontSize: '18',
              fontWeight: 'bold'
            }
          },
          labelLine: {
            show: false
          },
          data: [
            { value: 40, name: 'A仓库' },
            { value: 30, name: 'B仓库' },
            { value: 20, name: 'C仓库' },
            { value: 10, name: 'D仓库' }
          ]
        }
      ]
    };
    inventoryChart.setOption(inventoryOption);
    var trendChart = echarts.init(document.getElementById('trendChart'));
    var trendOption = {
      title: {
        text: '近期出入库趋势',
        left: 'center'
      },
      tooltip: {
        trigger: 'axis'
      },
      xAxis: {
        type: 'category',
        data: ['周一', '周二', '周三', '周四', '周五', '周六', '周日']
      },
      yAxis: {
        type: 'value'
      },
      series: [
        {
          name: '入库量',
          type: 'line',
          stack: '总量',
          data: [120, 132, 101, 134, 90, 230, 210],
          color: '#28a745'
        },
        {
          name: '出库量',
          type: 'line',
          stack: '总量',
          data: [220, 182, 191, 234, 290, 330, 310],
          color: '#dc3545'
        }
      ]
    };
    trendChart.setOption(trendOption);
    window.addEventListener('resize', function() {
      inventoryChart.resize();
      trendChart.resize();
    });
  </script>
</body>
</html>
