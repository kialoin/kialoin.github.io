<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>实时库存查询</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    body {
      background-color: #f5f5f5;
      color: #333;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #ffffff;
      padding: 0 20px;
      height: 60px;
      border-bottom: 1px solid #ddd;
    }
    .logo {
      font-weight: bold;
      font-size: 18px;
      color: #000;
    }
    .nav-links {
      display: flex;
      gap: 20px;
    }
    .nav-links a {
      text-decoration: none;
      color: #333;
      font-size: 14px;
    }
    .nav-links a:hover {
      color: #007bff;
    }
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      background-color: #fff;
      border: 1px solid #ddd;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    .search-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .search-input {
      width: 300px;
      padding: 8px;
      border: 1px solid #ccc;
    }
    .filter-section {
      display: flex;
      gap: 10px;
    }
    .filter-btn,
    .add-btn,
    .batch-delete-btn {
      padding: 8px 16px;
      border: 1px solid #ccc;
      background-color: #fff;
      cursor: pointer;
    }
    .add-btn {
      background-color: #007bff;
      color: white;
      border: none;
    }
    .add-btn:hover {
      background-color: #0056b3;
    }
    .batch-delete-btn {
      background-color: #dc3545;
      color: white;
      border: none;
    }
    .batch-delete-btn:hover {
      background-color: #c82333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th,
    td {
      padding: 12px;
      text-align: left;
      border: 1px solid #ddd;
    }
    th {
      background-color: #f1f1f1;
      font-weight: bold;
    }
    tr:nth-child(even) {
      background-color: #fafafa;
    }
    tr:hover {
      background-color: #e9ecef;
    }
    .action-icons i {
      margin-right: 10px;
      cursor: pointer;
      color: #007bff;
    }
    .action-icons i:hover {
      color: #0056b3;
    }
    .pagination {
      display: flex;
      justify-content: center;
      margin-top: 20px;
      gap: 10px;
    }
    .pagination button {
      padding: 8px 12px;
      border: 1px solid #ccc;
      background-color: #fff;
      cursor: pointer;
    }
    .pagination button.active {
      background-color: #007bff;
      color: white;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">钢材库存管理系统</div>
    <div class="nav-links">
      <a href="#">仪表盘首页</a>
      <a href="#" style="color:#007bff;">库存信息管理</a>
      <a href="#" style="color:#007bff;">实时库存查询</a>
      <a href="#">出入库操作</a>
      <a href="#">库存统计与报表</a>
      <a href="#">AI智能分析</a>
      <a href="#">系统设置</a>
      <a href="#">用户权限管理</a>
      <a href="#">消息通知</a>
    </div>
  </nav>
  <div class="container">
    <h1>实时库存查询</h1>
    <div class="search-bar">
      <input type="text" class="search-input" placeholder="请输入钢材名称或编号...">
      <div class="filter-section">
        <button class="filter-btn"><i class="fas fa-filter"></i> 高级筛选</button>
        <button class="add-btn"><i class="fas fa-file-export"></i> 导出数据</button>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th><input type="checkbox"></th>
          <th>钢材编号</th>
          <th>钢材类型</th>
          <th>规格型号</th>
          <th>数量(吨)</th>
          <th>仓储位置</th>
          <th>状态</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input type="checkbox"></td>
          <td>STL-001</td>
          <td>碳素结构钢</td>
          <td>Q235B</td>
          <td>50</td>
          <td>A仓库-第3排</td>
          <td><span style="color:green;">正常</span></td>
          <td class="action-icons">
            <i class="fas fa-edit"></i>
            <i class="fas fa-trash-alt"></i>
          </td>
        </tr>
        <tr>
          <td><input type="checkbox"></td>
          <td>STL-002</td>
          <td>合金结构钢</td>
          <td>40Cr</td>
          <td>30</td>
          <td>B仓库-第1排</td>
          <td><span style="color:red;">预警</span></td>
          <td class="action-icons">
            <i class="fas fa-edit"></i>
            <i class="fas fa-trash-alt"></i>
          </td>
        </tr>
        <tr>
          <td><input type="checkbox"></td>
          <td>STL-003</td>
          <td>不锈钢板</td>
          <td>304</td>
          <td>20</td>
          <td>C仓库-第2排</td>
          <td><span style="color:green;">正常</span></td>
          <td class="action-icons">
            <i class="fas fa-edit"></i>
            <i class="fas fa-trash-alt"></i>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="pagination">
      <button>&laquo;</button>
      <button class="active">1</button>
      <button>2</button>
      <button>3</button>
      <button>&raquo;</button>
    </div>
  </div>
</body>
</html>
