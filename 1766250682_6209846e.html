<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>库存统计与报表</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    body {
      background-color: #f5f5f5;
      color: #333;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #ffffff;
      padding: 0 20px;
      height: 60px;
      border-bottom: 1px solid #ddd;
    }
    .logo {
      font-weight: bold;
      font-size: 18px;
      color: #000;
    }
    .nav-links {
      display: flex;
      gap: 20px;
    }
    .nav-links a {
      text-decoration: none;
      color: #333;
      font-size: 14px;
    }
    .nav-links a:hover {
      color: #007bff;
    }
    .nav-links a.active {
      color: #007bff;
      border-bottom: 2px solid #007bff;
      padding-bottom: 4px;
    }
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      background-color: #fff;
      border: 1px solid #ddd;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    .search-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .search-input {
      width: 300px;
      padding: 8px;
      border: 1px solid #ccc;
    }
    .filter-section {
      display: flex;
      gap: 10px;
    }
    .filter-btn,
    .add-btn,
    .batch-delete-btn {
      padding: 8px 16px;
      border: 1px solid #ccc;
      background-color: #fff;
      cursor: pointer;
    }
    .add-btn {
      background-color: #007bff;
      color: white;
      border: none;
    }
    .add-btn:hover {
      background-color: #0056b3;
    }
    .batch-delete-btn {
      background-color: #dc3545;
      color: white;
      border: none;
    }
    .batch-delete-btn:hover {
      background-color: #c82333;
    }
    .chart-container {
      height: 400px;
      margin-bottom: 30px;
      border: 1px solid #ddd;
      padding: 10px;
    }
    .report-list {
      margin-top: 30px;
    }
    .report-item {
      padding: 15px;
      border: 1px solid #ddd;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .report-info {
      flex: 1;
    }
    .report-actions button {
      margin-left: 10px;
      padding: 5px 10px;
      border: 1px solid #ccc;
      background-color: #fff;
      cursor: pointer;
    }
    .report-actions button.download {
      background-color: #28a745;
      color: white;
      border: none;
    }
    .report-actions button.download:hover {
      background-color: #218838;
    }
    .pagination {
      display: flex;
      justify-content: center;
      margin-top: 20px;
      gap: 10px;
    }
    .pagination button {
      padding: 8px 12px;
      border: 1px solid #ccc;
      background-color: #fff;
      cursor: pointer;
    }
    .pagination button.active {
      background-color: #007bff;
      color: white;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">钢材库存管理系统</div>
    <div class="nav-links">
      <a href="#">仪表盘首页</a>
      <a href="#" class="active">库存统计与报表</a>
      <a href="#">实时库存查询</a>
      <a href="#">出入库操作</a>
      <a href="#">库存统计与报表</a>
      <a href="#">AI智能分析</a>
      <a href="#">系统设置</a>
      <a href="#">用户权限管理</a>
      <a href="#">消息通知</a>
    </div>
  </nav>
  <div class="container">
    <h1>库存统计与报表</h1>
    <div class="search-bar">
      <input type="text" class="search-input" placeholder="请输入报表名称或关键词...">
      <div class="filter-section">
        <button class="filter-btn"><i class="fas fa-filter"></i> 时间范围</button>
        <button class="filter-btn"><i class="fas fa-chart-bar"></i> 维度筛选</button>
        <button class="add-btn"><i class="fas fa-file-export"></i> 生成报表</button>
      </div>
    </div>
    <div id="chart" class="chart-container"></div>
    <div class="report-list">
      <h2>历史报表列表</h2>
      <div class="report-item">
        <div class="report-info">
          <strong>月度库存统计报表</strong>
          <p>生成时间：2023年10月1日 | 统计周期：2023年9月</p>
        </div>
        <div class="report-actions">
          <button class="download"><i class="fas fa-download"></i> 下载</button>
          <button><i class="fas fa-eye"></i> 预览</button>
          <button><i class="fas fa-trash-alt"></i> 删除</button>
        </div>
      </div>
      <div class="report-item">
        <div class="report-info">
          <strong>季度库存变动分析</strong>
          <p>生成时间：2023年9月15日 | 统计周期：2023年第三季度</p>
        </div>
        <div class="report-actions">
          <button class="download"><i class="fas fa-download"></i> 下载</button>
          <button><i class="fas fa-eye"></i> 预览</button>
          <button><i class="fas fa-trash-alt"></i> 删除</button>
        </div>
      </div>
      <div class="report-item">
        <div class="report-info">
          <strong>钢材类型分布图</strong>
          <p>生成时间：2023年8月20日 | 统计周期：2023年8月</p>
        </div>
        <div class="report-actions">
          <button class="download"><i class="fas fa-download"></i> 下载</button>
          <button><i class="fas fa-eye"></i> 预览</button>
          <button><i class="fas fa-trash-alt"></i> 删除</button>
        </div>
      </div>
    </div>
    <div class="pagination">
      <button>&laquo;</button>
      <button class="active">1</button>
      <button>2</button>
      <button>3</button>
      <button>&raquo;</button>
    </div>
  </div>
  <script>
    var chartDom = document.getElementById('chart');
    var myChart = echarts.init(chartDom);
    var option = {
      title: {
        text: '库存变动趋势'
      },
      tooltip: {
        trigger: 'axis'
      },
      legend: {
        data: ['入库量', '出库量', '库存总量']
      },
      xAxis: {
        type: 'category',
        boundaryGap: false,
        data: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月']
      },
      yAxis: {
        type: 'value'
      },
      series: [
        {
          name: '入库量',
          type: 'line',
          stack: '总量',
          data: [120, 132, 101, 134, 90, 230, 210, 150, 120, 132, 101, 134]
        },
        {
          name: '出库量',
          type: 'line',
          stack: '总量',
          data: [220, 182, 191, 234, 290, 330, 310, 120, 132, 101, 134, 90]
        },
        {
          name: '库存总量',
          type: 'line',
          stack: '总量',
          data: [150, 232, 201, 154, 190, 330, 410, 220, 150, 120, 132, 101]
        }
      ]
    };
    myChart.setOption(option);
  </script>
</body>
</html>
