<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>出入库操作</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    body {
      background-color: #f5f5f5;
      color: #333;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #ffffff;
      padding: 0 20px;
      height: 60px;
      border-bottom: 1px solid #ddd;
    }
    .logo {
      font-weight: bold;
      font-size: 18px;
      color: #000;
    }
    .nav-links {
      display: flex;
      gap: 20px;
    }
    .nav-links a {
      text-decoration: none;
      color: #333;
      font-size: 14px;
    }
    .nav-links a:hover {
      color: #007bff;
    }
    .nav-links a.active {
      color: #007bff;
      font-weight: bold;
      border-bottom: 2px solid #007bff;
    }
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
      background-color: #fff;
      border: 1px solid #ddd;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    .wizard-steps {
      display: flex;
      justify-content: space-between;
      margin-bottom: 30px;
      position: relative;
    }
    .wizard-steps::before {
      content: '';
      position: absolute;
      top: 15px;
      left: 0;
      right: 0;
      height: 2px;
      background-color: #e0e0e0;
      z-index: 1;
    }
    .step {
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .step-number {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background-color: #e0e0e0;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
      font-weight: bold;
    }
    .step.active .step-number {
      background-color: #007bff;
      color: white;
    }
    .step.completed .step-number {
      background-color: #28a745;
      color: white;
    }
    .step-label {
      font-size: 12px;
      color: #666;
    }
    .step.active .step-label {
      color: #007bff;
      font-weight: bold;
    }
    .step.completed .step-label {
      color: #28a745;
    }
    .form-section {
      background-color: #f8f9fa;
      padding: 20px;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .form-control {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    .form-row {
      display: flex;
      gap: 15px;
    }
    .form-row .form-group {
      flex: 1;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-primary {
      background-color: #007bff;
      color: white;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .btn-secondary {
      background-color: #6c757d;
      color: white;
    }
    .btn-secondary:hover {
      background-color: #545b62;
    }
    .btn-success {
      background-color: #28a745;
      color: white;
    }
    .btn-success:hover {
      background-color: #1e7e34;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .log-section {
      margin-top: 30px;
    }
    .log-item {
      padding: 10px;
      border-bottom: 1px solid #eee;
    }
    .log-item:last-child {
      border-bottom: none;
    }
    .log-time {
      font-size: 12px;
      color: #666;
    }
    .log-message {
      font-size: 14px;
      margin-top: 5px;
    }
    @media (max-width: 768px) {
      .form-row {
        flex-direction: column;
        gap: 0;
      }
      .nav-links {
        gap: 10px;
      }
      .search-bar {
        flex-direction: column;
        gap: 10px;
      }
      .filter-section {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">钢材库存管理系统</div>
    <div class="nav-links">
      <a href="#">仪表盘首页</a>
      <a href="#" class="active">出入库操作</a>
      <a href="#">实时库存查询</a>
      <a href="#">库存信息管理</a>
      <a href="#">库存统计与报表</a>
      <a href="#">AI智能分析</a>
      <a href="#">系统设置</a>
      <a href="#">用户权限管理</a>
      <a href="#">消息通知</a>
    </div>
  </nav>
  <div class="container">
    <h1>出入库操作</h1>
    <div class="wizard-steps">
      <div class="step active">
        <div class="step-number">1</div>
        <div class="step-label">选择操作类型</div>
      </div>
      <div class="step">
        <div class="step-number">2</div>
        <div class="step-label">填写钢材信息</div>
      </div>
      <div class="step">
        <div class="step-number">3</div>
        <div class="step-label">确认并提交</div>
      </div>
    </div>
    <div class="form-section">
      <h2>出入库操作表单</h2>
      <div class="form-group">
        <label for="operation-type">操作类型</label>
        <select id="operation-type" class="form-control">
          <option value="">请选择操作类型</option>
          <option value="in">钢材入库</option>
          <option value="out">钢材出库</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="steel-type">钢材类型</label>
          <select id="steel-type" class="form-control">
            <option value="">请选择钢材类型</option>
            <option value="carbon-steel">碳素结构钢</option>
            <option value="alloy-steel">合金结构钢</option>
            <option value="stainless-steel">不锈钢板</option>
            <option value="other">其他</option>
          </select>
        </div>
        <div class="form-group">
          <label for="quantity">数量(吨)</label>
          <input type="number" id="quantity" class="form-control" placeholder="请输入数量">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="supplier">供应商/客户</label>
          <input type="text" id="supplier" class="form-control" placeholder="请输入供应商或客户名称">
        </div>
        <div class="form-group">
          <label for="warehouse-location">仓储位置</label>
          <select id="warehouse-location" class="form-control">
            <option value="">请选择仓储位置</option>
            <option value="A-1">A仓库-第1排</option>
            <option value="A-2">A仓库-第2排</option>
            <option value="A-3">A仓库-第3排</option>
            <option value="B-1">B仓库-第1排</option>
            <option value="B-2">B仓库-第2排</option>
            <option value="C-1">C仓库-第1排</option>
            <option value="C-2">C仓库-第2排</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="remarks">备注</label>
        <textarea id="remarks" class="form-control" rows="3" placeholder="请输入操作备注"></textarea>
      </div>
      <div class="btn-group">
        <button class="btn btn-secondary" id="prev-btn"><i class="fas fa-arrow-left"></i> 上一步</button>
        <button class="btn btn-primary" id="next-btn">下一步 <i class="fas fa-arrow-right"></i></button>
      </div>
    </div>
    <div class="log-section">
      <h2>操作日志</h2>
      <div class="log-item">
        <div class="log-time">2023-05-15 14:30:22</div>
        <div class="log-message">钢材入库操作完成：碳素结构钢 Q235B 50吨，来源：上海钢铁集团</div>
      </div>
      <div class="log-item">
        <div class="log-time">2023-05-14 09:15:45</div>
        <div class="log-message">钢材出库操作完成：合金结构钢 40Cr 30吨，去向：华东机械厂</div>
      </div>
      <div class="log-item">
        <div class="log-time">2023-05-13 16:22:10</div>
        <div class="log-message">钢材入库操作完成：不锈钢板 304 20吨，来源：无锡不锈钢公司</div>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const nextBtn = document.getElementById('next-btn');
      const prevBtn = document.getElementById('prev-btn');
      const steps = document.querySelectorAll('.step');
      let currentStep = 0;
      nextBtn.addEventListener('click', function() {
        if (currentStep < steps.length - 1) {
          steps[currentStep].classList.remove('active');
          steps[currentStep].classList.add('completed');
          currentStep++;
          steps[currentStep].classList.add('active');
        }
      });
      prevBtn.addEventListener('click', function() {
        if (currentStep > 0) {
          steps[currentStep].classList.remove('active');
          steps[currentStep].classList.remove('completed');
          currentStep--;
          steps[currentStep].classList.add('active');
        }
      });
      document.getElementById('next-btn').addEventListener('click', function() {
        const operationType = document.getElementById('operation-type').value;
        const steelType = document.getElementById('steel-type').value;
        const quantity = document.getElementById('quantity').value;
        if (!operationType || !steelType || !quantity) {
          alert('请填写所有必填项！');
          return false;
        }
        setTimeout(() => {
          alert('操作已成功提交！');
        }, 500);
      });
    });
  </script>
</body>
</html>
